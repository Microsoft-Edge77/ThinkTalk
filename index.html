<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ThinkTalk</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--accent:#ff4500;--bg:#000;--text:#fff;--muted:#888}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;position:fixed;inset:0}
#canvas-dust{position:fixed;inset:0;z-index:0;pointer-events:none}
.app-root{position:relative;z-index:1;height:100%;display:none;flex-direction:column;transition:.45s}
.view-blur{filter:blur(20px);transform:translateX(-20px)}
.tiles-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:900px){.tiles-grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);padding:14px;height:130px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;backdrop-filter:blur(8px);transition:.18s;border-radius:8px}
.tile:hover{transform:translateY(-4px);box-shadow:0 6px 18px rgba(0,0,0,.6)}
.title{font-weight:600;font-size:1rem;display:flex;align-items:center;gap:8px}
.lock-badge{font-size:.75rem;opacity:.6;color:var(--muted)}
.tile-preview{font-size:.75rem;color:#bdbdbd;margin-top:6px;line-height:1.2;max-height:2.4em;overflow:hidden;white-space:pre-wrap}
.tile-delete-btn{position:absolute;top:8px;right:8px;font-size:.75rem;background:#c00;color:#fff;border:none;padding:6px 8px;cursor:pointer;border-radius:6px;z-index:12}
.msg-block{opacity:0;transform:translateY(10px);transition:.45s;margin-bottom:16px;max-width:85%;cursor:pointer}
.msg-block.own{align-self:flex-end}
.msg-block.visible{opacity:1;transform:translateY(0)}
.msg-info{font-size:.68rem;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;text-transform:uppercase;letter-spacing:1px}
.msg-block.own .msg-info{justify-content:flex-end;color:var(--accent)}
.msg-text{background:rgba(255,255,255,.05);padding:12px;border-left:3px solid var(--accent);border-radius:6px;word-break:break-word}
.msg-block.own .msg-text{border-left:none;border-right:3px solid #666;background:rgba(255,255,255,.03)}
.msg-img{max-width:100%;border-radius:6px}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9000;display:none;align-items:center;justify-content:center;padding:20px}
.popup-card{background:#000;border:2px solid var(--accent);width:100%;max-width:420px;padding:22px;opacity:0;transition:.28s;border-radius:10px}
.popup-card.visible{opacity:1}
.top-bar{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;height:64px;border-bottom:1px solid rgba(255,255,255,.03)}
.top-title{font-size:2rem;font-weight:100;color:var(--accent);cursor:pointer}
.top-actions{display:flex;gap:10px}
.top-btn{background:#111;border:1px solid #222;color:#fff;padding:8px 10px;font-size:.85rem;cursor:pointer;border-radius:6px}
.view-container{flex:1;overflow-y:auto;padding:12px 12px 120px}
.view-section{display:none}
.view-section.active{display:block}
.bottom-nav{position:fixed;bottom:0;width:100%;height:60px;display:flex;background:#000;border-top:1px solid #222;z-index:5}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer;font-size:.85rem;letter-spacing:1px}
.nav-btn.active{color:#fff;border-top:3px solid var(--accent);font-weight:700}
.input-box{width:100%;background:rgba(255,255,255,.06);border:1px solid #222;padding:12px;color:#fff;outline:none;margin-bottom:10px;border-radius:8px}
.btn-full{width:100%;padding:12px;background:var(--accent);border:none;color:#fff;cursor:pointer;font-weight:700;text-transform:uppercase;border-radius:8px}
.auth-toggle-link{color:var(--accent);font-size:.9rem;margin-top:12px;text-align:center;cursor:pointer}
.color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.color-dot{width:34px;height:34px;border-radius:50%;border:2px solid #222;cursor:pointer;position:relative;overflow:hidden}
.color-dot.selected{border-color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.hidden{display:none!important}
#auth-card{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:20px 22px;backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.7);transition:.35s;transform:scale(.98);opacity:.9;filter:blur(1px)}
#auth-card.auth-active{transform:scale(1);opacity:1;filter:blur(0)}
#auth-card.auth-switching{transform:scale(.96);opacity:.3;filter:blur(4px)}
#view-chat{background-size:cover;background-position:center;background-repeat:no-repeat;position:relative}
#view-chat::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.4));pointer-events:none;z-index:0}
#chat-messages{position:relative;z-index:1}
</style>
</head>

<body>

<canvas id="canvas-dust"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, query, orderBy, where,
  serverTimestamp, getDocs, deleteDoc, doc, getDoc, setDoc, limit
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyCv4nD9Nyez5ERGvW47q-6O-TA96zWJn0M",
  authDomain:"thinktalk-b3c85.firebaseapp.com",
  projectId:"thinktalk-b3c85",
  storageBucket:"thinktalk-b3c85.firebasestorage.app",
  messagingSenderId:"752141817301",
  appId:"1:752141817301:web:28fecaf81db27eb51d595c"
};
const app=initializeApp(cfg);
const db=getFirestore(app);

const byId=id=>document.getElementById(id);
const qsa=sel=>Array.from(document.querySelectorAll(sel));
const getAccent=()=>getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();

let currentUser=localStorage.getItem("tt_user")||null;
let curRoom="général";
let unsubChat=null;
let selectedMsgId=null;
let authMode="login";
let confirmCallback=null;
let isPrivateCurrent=false;

let roomsCache=[];
let contactsCache=[];
let friendReqCache=[];
const lastMessagesByRoom=new Map();
const lastMessagesByDM=new Map();

let allowedRooms=[];
try{allowedRooms=JSON.parse(localStorage.getItem("tt_allowedRooms")||"[]")}catch{}

const canvas=byId("canvas-dust");
const ctx=canvas.getContext("2d");
let pts=[];
const mouse={x:-9999,y:-9999};

function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener("resize",resizeCanvas);
resizeCanvas();
addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});

class Particle{
  constructor(){this.init();this.target=null}
  init(){
    this.x=Math.random()*canvas.width;
    this.y=Math.random()*canvas.height;
    this.vx=(Math.random()-.5)*1.2;
    this.vy=(Math.random()-.5)*1.2;
    this.s=Math.random()*2+1;
  }
  update(){
    if(this.target){
      this.x+=(this.target.x-this.x)*.15;
      this.y+=(this.target.y-this.y)*.15;
      return;
    }
    const dx=mouse.x-this.x,dy=mouse.y-this.y,d=Math.hypot(dx,dy);
    if(d<100){this.vx-=dx*.0003;this.vy-=dy*.0003}
    this.x+=this.vx;this.y+=this.vy;
    this.vx*=.99;this.vy*=.99;
    if(this.x<0||this.x>canvas.width)this.vx*=-1;
    if(this.y<0||this.y>canvas.height)this.vy*=-1;
  }
  draw(){
    const a=getAccent()||"#ff4500";
    ctx.fillStyle=a+"cc";
    ctx.shadowBlur=8;
    ctx.shadowColor=a;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.s,0,6.28);
    ctx.fill();
    ctx.shadowBlur=0;
  }
}
for(let i=0;i<350;i++)pts.push(new Particle());
(function anim(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{p.update();p.draw()});requestAnimationFrame(anim)})();

function openPopup(p,c){byId(p).style.display="flex";setTimeout(()=>byId(c).classList.add("visible"),10)}
function closePopups(){qsa(".popup-overlay").forEach(p=>p.style.display="none");qsa(".popup-card").forEach(c=>c.classList.remove("visible"))}
function showMessage(t){byId("msg-text").innerText=t;openPopup("pop-message","card-message")}
function showConfirm(t,cb){confirmCallback=cb;byId("confirm-text").innerText=t;openPopup("pop-confirm","card-confirm")}

function updateAuthUI(){
  const t=byId("auth-mode-title"),b=byId("btn-login"),tg=byId("auth-toggle"),c=byId("auth-card");
  c.classList.add("auth-switching");
  if(authMode==="login"){t.innerText="Se connecter";b.innerText="SE CONNECTER";tg.innerText="Vous n'avez pas de compte ? Rejoindre ThinkTalk"}
  else{t.innerText="Créer un compte";b.innerText="CRÉER UN COMPTE";tg.innerText="Vous avez déjà un compte ? Se connecter"}
  setTimeout(()=>{c.classList.remove("auth-switching");c.classList.add("auth-active")},200);
}

async function handleLogin(){
  const p=byId("auth-pseudo").value.trim().toLowerCase();
  const c=byId("auth-code").value.trim();
  if(!p||!c)return showMessage("Pseudo et code requis.");
  const uRef=doc(db,"users",p);
  const uDoc=await getDoc(uRef);
  if(authMode==="login"){
    if(!uDoc.exists())return showMessage("Ce compte n'existe pas.");
    if(uDoc.data().code!==c)return showMessage("Code incorrect.");
    localStorage.setItem("tt_user",p);currentUser=p;
    byId("auth-screen").style.display="none";byId("main-app").style.display="flex";
    enterRoom("général");
  }else{
    if(uDoc.exists())return showMessage("Ce pseudo est déjà utilisé.");
    await setDoc(uRef,{code:c});
    localStorage.setItem("tt_user",p);currentUser=p;
    byId("auth-screen").style.display="none";byId("main-app").style.display="flex";
    enterRoom("général");
  }
}

function compressImageToBase64(f,maxW=900,maxH=700,q=0.1){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const ratio=Math.min(maxW/w,maxH/h,1);
        w*=ratio;h*=ratio;
        const c=document.createElement("canvas");
        c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",q));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(f);
  });
}

async function setBackgroundForCurrentChat(f){
  if(!f||!currentUser)return;
  const data=await compressImageToBase64(f);
  if(isPrivateCurrent)await setDoc(doc(db,"dmBackgrounds",curRoom),{background:data});
  else{
    const r=roomsCache.find(r=>r.name===curRoom);
    if(!r)return;
    await setDoc(doc(db,"rooms",r._id),{...r,background:data});
  }
  loadChatBackground(curRoom,isPrivateCurrent);
}

async function loadChatBackground(n,priv){
  const v=byId("view-chat");
  if(priv){
    const d=await getDoc(doc(db,"dmBackgrounds",curRoom));
    v.style.backgroundImage=d.exists()?`url(${d.data().background})`:"none";
  }else{
    const r=roomsCache.find(r=>r.name===n);
    v.style.backgroundImage=r&&r.background?`url(${r.background})`:"none";
  }
}

let neonInterval=null;
const neonCycle=["#ff0033","#ff4500","#ff8800","#ffcc00","#ff8800","#ff4500"];
let neonIndex=0;

function applyAccent(c){document.documentElement.style.setProperty("--accent",c);localStorage.setItem("tt_accent",c)}
function startNeon(){if(neonInterval)clearInterval(neonInterval);neonInterval=setInterval(()=>{neonIndex=(neonIndex+1)%neonCycle.length;applyAccent(neonCycle[neonIndex])},250)}
function stopNeon(){if(neonInterval)clearInterval(neonInterval);neonInterval=null}

function initAccent(){
  const saved=localStorage.getItem("tt_accent");if(saved)applyAccent(saved);
  const grid=byId("accent-presets");
  const presets=["#0078d7","#8e44ad","#27ae60","#e67e22","#e91e63","#ff4757","#1abc9c","#f1c40f","#3498db","#9b59b6"];
  grid.innerHTML="";
  presets.forEach(c=>{
    const d=document.createElement("div");
    d.className="color-dot";d.style.background=c;
    d.onclick=()=>{stopNeon();applyAccent(c);qsa(".color-dot").forEach(x=>x.classList.remove("selected"));d.classList.add("selected")};
    grid.appendChild(d);
  });
  byId("btn-neon-colors").onclick=()=>{
    grid.innerHTML="";
    [["#ff0033","#ff8800"],["#00eaff","#33f1ff"],["#39ff14","#b3ff00"],["#b300ff","#ff00ff"]].forEach(c=>{
      const d=document.createElement("div");
      d.className="color-dot";
      d.style.background=`radial-gradient(circle at 30% 30%,${c[0]},${c[1]})`;
      d.onclick=()=>{qsa(".color-dot").forEach(x=>x.classList.remove("selected"));d.classList.add("selected");neonIndex=0;startNeon()};
      grid.appendChild(d);
    });
  };
  byId("btn-more-colors").onclick=()=>{const a=byId("advanced-color");a.style.display=a.style.display==="none"?"block":"none"};
  byId("accent-picker").oninput=()=>{stopNeon();applyAccent(byId("accent-picker").value)};
}
function renderRoomsTiles(){
  const g=byId("rooms-grid");
  g.innerHTML="";
  const search=byId("rooms-search").value.trim().toLowerCase();
  roomsCache.forEach(r=>{
    if(search&&!r.name.toLowerCase().includes(search))return;
    const prev=lastMessagesByRoom.get(r.name)||[];
    const txt=prev.map(m=>`${m.sender}: ${m.text}`).join(" • ").slice(0,120);
    const t=document.createElement("div");
    t.className="tile";
    t.innerHTML=`<div class="title"># ${r.name}${r.pass?'<span class="lock-badge">🔒</span>':''}</div>
                 <div class="tile-preview">${txt||'<span class="muted">Aucun message</span>'}</div>`;
    if(r.owner===currentUser){
      const d=document.createElement("button");
      d.className="tile-delete-btn";d.textContent="Suppr.";
      d.onclick=e=>{
        e.stopPropagation();
        showConfirm(`Supprimer #${r.name} ?`,async()=>{
          await deleteDoc(doc(db,"rooms",r._id));
        });
      };
      t.appendChild(d);
    }
    t.onclick=()=>enterRoom(r.name,false);
    g.appendChild(t);
  });
}

function setupRoomsSnapshot(){
  onSnapshot(collection(db,"rooms"),snap=>{
    roomsCache=[];
    snap.forEach(d=>roomsCache.push({...d.data(),_id:d.id}));
    renderRoomsTiles();
  });
}

function setupContactsSnapshot(){
  onSnapshot(collection(db,"contacts"),snap=>{
    contactsCache=[];
    snap.forEach(d=>contactsCache.push({...d.data(),_id:d.id}));
    renderContactsTiles(friendReqCache);
  });
}

function setupFriendRequestsSnapshot(){
  if(!currentUser)return;
  onSnapshot(
    query(collection(db,"friendRequests"),where("to","==",currentUser)),
    snap=>{
      friendReqCache=[];
      snap.forEach(d=>friendReqCache.push({...d.data(),_id:d.id}));
      renderContactsTiles(friendReqCache);
    }
  );
}

function setupMessagesSnapshot(){
  onSnapshot(
    query(collection(db,"messages"),orderBy("timestamp","asc")),
    snap=>{
      lastMessagesByRoom.clear();
      lastMessagesByDM.clear();
      snap.forEach(d=>{
        const m=d.data();
        const room=m.room;
        const entry={sender:m.sender,text:m.text||"[image]"};
        if(room.includes("_")){
          const arr=lastMessagesByDM.get(room)||[];
          arr.push(entry);if(arr.length>2)arr.shift();
          lastMessagesByDM.set(room,arr);
        }else{
          const arr=lastMessagesByRoom.get(room)||[];
          arr.push(entry);if(arr.length>2)arr.shift();
          lastMessagesByRoom.set(room,arr);
        }
      });
      renderRoomsTiles();
      renderContactsTiles(friendReqCache);
    }
  );
}

async function createRoom(){
  const n=byId("new-room-name").value.trim();
  const p=byId("new-room-pass").value.trim();
  if(!n)return;
  const s=await getDocs(query(collection(db,"rooms"),where("name","==",n),limit(1)));
  if(!s.empty)return showMessage("Ce salon existe déjà.");
  await addDoc(collection(db,"rooms"),{name:n,pass:p,owner:currentUser});
  closePopups();
  byId("new-room-name").value="";
  byId("new-room-pass").value="";
}

async function sendImageFile(f){
  if(!f||!currentUser)return;
  const r=new FileReader();
  r.onload=async e=>{
    await addDoc(collection(db,"messages"),{
      image:e.target.result,
      room:curRoom,
      sender:currentUser,
      timestamp:serverTimestamp()
    });
  };
  r.readAsDataURL(f);
}

function switchTab(t){
  const app=byId("main-app");
  app.classList.add("view-blur");
  qsa(".nav-btn").forEach(b=>b.classList.remove("active"));
  const btn=qsa(".nav-btn").find(b=>b.dataset.tab===t);
  if(btn)btn.classList.add("active");
  setTimeout(()=>{
    qsa(".view-section").forEach(s=>s.classList.remove("active"));
    byId("view-"+t).classList.add("active");
    app.classList.remove("view-blur");
  },250);
}

function initUI(){
  qsa(".nav-btn").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  byId("btn-open-session").onclick=()=>openPopup("pop-logout","card-logout");
  byId("btn-open-create").onclick=()=>openPopup("pop-create","card-create");
  byId("btn-open-accent").onclick=()=>openPopup("pop-accent","card-accent");
  qsa("[data-close-popup]").forEach(b=>b.onclick=closePopups);

  byId("btn-logout").onclick=()=>{localStorage.removeItem("tt_user");location.reload()};
  byId("btn-delete-profile").onclick=()=>{
    showConfirm("Supprimer le profil ?",async()=>{
      await deleteDoc(doc(db,"users",currentUser));
      const c1=await getDocs(query(collection(db,"contacts"),where("owner","==",currentUser)));
      const c2=await getDocs(query(collection(db,"contacts"),where("name","==",currentUser)));
      c1.forEach(d=>deleteDoc(doc(db,"contacts",d.id)));
      c2.forEach(d=>deleteDoc(doc(db,"contacts",d.id)));
      localStorage.removeItem("tt_user");
      location.reload();
    });
  };

  byId("msg-ok-btn").onclick=closePopups;
  byId("confirm-yes").onclick=()=>{if(confirmCallback)confirmCallback();confirmCallback=null;closePopups()};
  byId("confirm-no").onclick=()=>{confirmCallback=null;closePopups()};

  byId("btn-login").onclick=handleLogin;
  byId("auth-toggle").onclick=()=>{authMode=authMode==="login"?"register":"login";updateAuthUI()};

  byId("btn-do-create").onclick=createRoom;
  byId("rooms-search").oninput=()=>renderRoomsTiles();

  byId("send-btn").onclick=sendMessage;
  byId("chat-input").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}};
  byId("btn-attach").onclick=()=>byId("file-input").click();
  byId("file-input").onchange=e=>{sendImageFile(e.target.files[0]);e.target.value=""};
  byId("btn-msg-del").onclick=deleteMessage;

  byId("btn-wallpaper").onclick=()=>byId("bg-file-input").click();
  byId("bg-file-input").onchange=e=>{setBackgroundForCurrentChat(e.target.files[0]);e.target.value=""};

  byId("btn-add-contact").onclick=addContact;
  byId("contacts-search").oninput=()=>renderContactsTiles(friendReqCache);

  initAccent();
  updateAuthUI();
}

async function ensureGeneralRoom(){
  const s=await getDocs(query(collection(db,"rooms"),where("name","==","général"),limit(1)));
  if(s.empty)await addDoc(collection(db,"rooms"),{name:"général",pass:"",owner:"system"});
}

async function initApp(){
  initUI();
  await ensureGeneralRoom();
  setupRoomsSnapshot();
  setupContactsSnapshot();
  setupFriendRequestsSnapshot();
  setupMessagesSnapshot();

  if(currentUser){
    byId("auth-screen").style.display="none";
    byId("main-app").style.display="flex";
    enterRoom("général");
  }else{
    byId("auth-screen").style.display="flex";
    byId("main-app").style.display="none";
  }
}

initApp();
</script>
