<title>ThinkTalk</title>

<style>
/* ===== THINKTALK — Metro UI × Mica × Liquid Glass ===== */
:root{
--a:#0078d7;
--b:18px;
--s:rgba(22,26,34,.58);
--s2:rgba(28,32,42,.46);
--hair:rgba(255,255,255,.09);
--text:#f3f5f8;
--muted:rgba(243,245,248,.66);
--radius:0px;
}
*{box-sizing:border-box;margin:0;border-radius:0!important}
html,body{height:100%;background:#000;color:var(--text);font:16px/1.55 'Segoe UI Variable Text','Segoe UI Variable',Segoe UI,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
canvas#bg{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;display:grid;grid-template-columns:76px 1fr;height:100dvh}
.acr{background:var(--s);backdrop-filter:blur(var(--b)) saturate(150%);-webkit-backdrop-filter:blur(var(--b)) saturate(150%);border:1px solid var(--hair);box-shadow:0 18px 50px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.05)}
nav{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 18px;border:0;border-right:1px solid var(--hair)}
.nlogo{width:38px;height:38px;margin:4px 0 14px;display:block;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
nav button{position:relative;width:56px;height:52px;background:transparent;border:0;color:var(--text);opacity:.58;cursor:pointer;transition:opacity .22s ease,background .22s ease,transform .22s ease}
nav button:hover{opacity:1;background:rgba(255,255,255,.08);transform:translateY(-1px)}
nav button:active{transform:scale(.96)}
nav button.on{opacity:1;background:rgba(255,255,255,.10)}
nav button.on::before{content:'';position:absolute;left:8px;top:12px;bottom:12px;width:3px;background:var(--a);box-shadow:0 0 12px color-mix(in srgb,var(--a) 65%,transparent)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:12px;padding:20px 28px 10px}
header h1{font-weight:600;font-size:30px;letter-spacing:-.4px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,input,select,textarea{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tile:focus-visible{outline:2px solid color-mix(in srgb,var(--a) 85%,#fff);outline-offset:2px}
.btn{background:color-mix(in srgb,var(--a) 88%,#fff);border:0;padding:11px 20px;cursor:pointer;font-weight:600;font-size:15px;color:#fff;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;box-shadow:0 8px 22px color-mix(in srgb,var(--a) 28%,transparent)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:scale(.97);filter:brightness(.9)}
.ib{background:transparent;border:0;cursor:pointer;padding:9px;display:inline-flex;opacity:.72;transition:opacity .18s ease,background .18s ease,transform .18s ease}
.ib:hover{opacity:1;background:rgba(255,255,255,.09);transform:translateY(-1px)}
.nex{opacity:.55;color:var(--text);text-decoration:none}
.nex:hover{opacity:1;background:rgba(255,255,255,.09);transform:translateY(-1px)}
input[type=text],input[type=password],textarea,select{background:rgba(255,255,255,.07);border:0;padding:12px 14px;width:100%;font-size:15px;transition:background .2s ease,box-shadow .2s ease}
select option{background:#111318}
input:focus,textarea:focus,select:focus{background:rgba(255,255,255,.11);box-shadow:inset 0 -2px 0 var(--a)}
input[type=range]{width:130px;accent-color:var(--a)}
input[type=checkbox]{accent-color:var(--a);width:18px;height:18px}
#view{flex:1;overflow:auto;padding:8px 28px 28px;min-height:0;container-type:inline-size;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
#find{font-size:17px;padding:14px 16px;margin-top:10px;background:rgba(255,255,255,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:10px 0 6px}
.tile{position:relative;min-height:150px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:3px;background:var(--s2);border:1px solid var(--hair);overflow:hidden;transition:background .22s ease,transform .22s ease,box-shadow .22s ease;animation:tile .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*45ms);min-width:0;backdrop-filter:blur(var(--b)) saturate(140%);-webkit-backdrop-filter:blur(var(--b)) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tile:hover{background:rgba(255,255,255,.12);transform:translateY(-3px);box-shadow:0 20px 44px rgba(0,0,0,.42)}
.tile:active{transform:scale(.98)}
.tile.w{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 72%,#000) 0%,color-mix(in srgb,var(--a) 42%,#000) 100%);border-color:color-mix(in srgb,var(--a) 55%,transparent)}
.tile.w:hover{filter:brightness(1.1)}
.tile h3{font-weight:600;font-size:23px;line-height:1.2;padding-right:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .d{font-size:14px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .p{font-size:13px;color:var(--muted);margin-top:4px}
.tile .last{margin-top:auto;padding-top:10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.dot{position:absolute;top:16px;right:16px;width:9px;height:9px;background:rgba(255,255,255,.24)}
.dot.on{background:#57d364;box-shadow:0 0 10px rgba(87,211,100,.65)}
@container (min-width:540px){.tile.w{grid-column:span 2}}
.ts{animation:ts .45s cubic-bezier(.16,1,.3,1) both;transform-origin:0 50%}
.out{animation:tso .16s ease-in both;transform-origin:0 50%}
@keyframes ts{0%{opacity:0;transform:perspective(1100px) rotateY(-68deg) translateX(-16px)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes tso{to{opacity:0;transform:perspective(1100px) rotateY(58deg) translateX(14px)}}
@keyframes tile{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
html.noanim *{animation:none!important;transition:none!important}
.msgs{display:flex;flex-direction:column;gap:10px}
.m{max-width:min(640px,90%);padding:11px 15px 12px;position:relative;align-self:flex-start;background:var(--s2);border:1px solid var(--hair);backdrop-filter:blur(var(--b)) saturate(140%);-webkit-backdrop-filter:blur(var(--b)) saturate(140%);animation:ts .35s cubic-bezier(.16,1,.3,1) both;box-shadow:0 10px 28px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.04)}
.m.me{align-self:flex-end;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 62%,rgba(0,0,0,.55)) 0%,color-mix(in srgb,var(--a) 34%,rgba(0,0,0,.6)) 100%);border-color:color-mix(in srgb,var(--a) 45%,transparent)}
.m .n{font-size:12px;color:var(--muted);margin-bottom:3px}
.m .t{white-space:pre-wrap;word-break:break-word;font-size:15px}
.m .dd{position:absolute;top:6px;right:8px;opacity:.45;cursor:pointer;background:none;border:0;letter-spacing:1px}
.m .dd:hover{opacity:1}
.m img{max-width:100%;max-height:280px;display:block;margin-top:8px;box-shadow:0 10px 28px rgba(0,0,0,.34)}
.m a{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:9px 12px;background:rgba(255,255,255,.08);color:#fff;text-decoration:none;transition:background .18s ease,transform .18s ease}
.m a:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
.compose{display:flex;gap:8px;padding:10px 28px 14px;align-items:flex-end;border:0}
.compose textarea{resize:none;height:48px;background:rgba(255,255,255,.07)}
.chip{display:flex;gap:9px;align-items:center;padding:8px 28px;font-size:13px;color:var(--muted)}
.file-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;background:rgba(255,255,255,.08);border:1px solid var(--hair);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;transition:background .2s ease,transform .2s ease,box-shadow .2s ease}
.file-btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.file-btn:active{transform:scale(.97)}
.menu{position:fixed;z-index:50;min-width:190px;padding:6px;background:rgba(18,22,30,.86);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);animation:rise .18s ease both;box-shadow:0 18px 44px rgba(0,0,0,.5);border:1px solid var(--hair)}
.menu div{padding:11px 13px;cursor:pointer;transition:background .15s ease}
.menu div:hover{background:color-mix(in srgb,var(--a) 72%,transparent)}
#side{position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(400px,100%);padding:24px;overflow:auto;background:rgba(15,18,24,.68);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:-24px 0 70px rgba(0,0,0,.45);border:0;border-left:1px solid var(--hair)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0}
.sec{font-weight:600;font-size:20px;margin:24px 0 8px;padding-top:16px}
.sec:first-child{margin-top:0;padding-top:0}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 34px;max-width:940px}
.forms>div{display:grid;gap:10px;align-content:start}
.forms h3{font-weight:600;font-size:18px}
.sw{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0}
.sw button{width:40px;height:40px;border:2px solid transparent;cursor:pointer;background-clip:padding-box;transition:transform .18s ease,box-shadow .18s ease}
.sw button:hover{transform:scale(1.09)}
.sw button.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.65),0 0 18px color-mix(in srgb,var(--a) 55%,transparent)}
.hint{font-size:13px;color:var(--muted)}
/* ===== ÉCRAN DE CONNEXION ===== */
#login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 28%,color-mix(in srgb,var(--a) 17%,transparent),transparent 62%),rgba(2,4,8,.8);backdrop-filter:blur(8px) saturate(120%);-webkit-backdrop-filter:blur(8px) saturate(120%)}
#login>div.auth-card{width:min(450px,100%);padding:34px 34px 24px;display:flex;flex-direction:column;gap:12px;animation:rise .5s cubic-bezier(.16,1,.3,1) both;background:rgba(15,19,27,.7);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid var(--hair);border-top:3px solid var(--a);box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.auth-logo{width:54px;height:54px;display:block;flex:none;filter:drop-shadow(0 10px 24px color-mix(in srgb,var(--a) 45%,transparent))}
.auth-brand h1{font-size:30px;font-weight:650;line-height:1.1;letter-spacing:-.3px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(255,255,255,.14);margin:6px 0 2px}
.auth-tab{background:transparent;border:0;padding:12px 6px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-weight:600;transition:color .18s ease,border-color .18s ease}
.auth-tab:hover{color:var(--text)}
.auth-tab.active{color:#fff;border-bottom-color:var(--a)}
.auth-intro{padding:6px 0}
.auth-intro h2{font-size:25px;font-weight:600}
.auth-label{font-size:13px;color:var(--muted);font-weight:600;margin-top:3px}
.auth-card input{background:rgba(255,255,255,.075);border:0;border-bottom:2px solid rgba(255,255,255,.16);padding:14px}
.auth-card input:focus{border-bottom-color:var(--a);box-shadow:none;background:rgba(255,255,255,.11)}
.auth-submit{width:100%;margin-top:8px;padding:14px}
.auth-submit:disabled{opacity:.55;cursor:wait}
.auth-link{background:transparent;border:0;color:var(--muted);padding:7px;cursor:pointer;font-size:13px}
.auth-link:hover{color:#fff}
.local-account{display:grid;gap:3px;padding:12px;background:rgba(255,255,255,.055);border-left:3px solid var(--a)}
.auth-status{min-height:20px;color:#ff9b9b;font-size:13px}
.auth-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;color:var(--muted);font-size:11px}
.auth-lang{display:flex;gap:4px}
.auth-lang button{background:transparent;border:0;color:var(--muted);padding:5px 7px;cursor:pointer;font-weight:600}
.auth-lang button.selected{color:#fff;background:rgba(255,255,255,.1)}
@media(max-width:700px){
#app{grid-template-columns:1fr;grid-template-rows:1fr 62px}
nav{order:2;flex-direction:row;justify-content:space-around;padding:0;border:0;border-top:1px solid var(--hair)}
.nlogo{display:none}
nav button{height:62px;flex:1}
nav button.on::before{left:16px;right:16px;top:0;bottom:auto;width:auto;height:3px}
header{padding:16px 18px 6px}
header h1{font-size:26px}
#view{padding:6px 18px 22px}
.compose,.chip{padding-left:14px;padding-right:14px}
.m{max-width:96%}
.forms{grid-template-columns:1fr}
#login{padding:14px}
#login>div.auth-card{padding:26px 22px 18px}
}
</style></head><body>

/* ===== DATABASE (IndexedDB) ===== */

/* ===== SETTINGS ===== */

const cfg=Object.assign({a:PAL[0][0],b:6,part:true,anim:true,notif:false},JSON.parse(localStorage.tt_cfg||'{}'));delete cfg.g;cfg.b=Math.min(+cfg.b||0,16);if(!PAL.some(p=>p[0]===cfg.a))cfg.a=PAL[0][0];
