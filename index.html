<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ThinkTalk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root { --accent:#0078d7; --bg:#000; --text:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:"Segoe UI",sans-serif; }
    body { background:var(--bg); color:var(--text); overflow:hidden; height:100svh; position:fixed; width:100%; }
    #canvas-dust { position:fixed; inset:0; z-index:0; pointer-events:none; }

    .app-root { position:relative; z-index:1; height:100%; display:none; flex-direction:column; transition:transform .6s cubic-bezier(.4,0,.2,1), filter .6s; }
    .view-blur { filter:blur(25px); transform:translateX(-30px); }

    .tiles-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .tile { position:relative; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); padding:15px; height:130px; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; backdrop-filter:blur(10px); transition:transform .2s, opacity .2s; overflow:hidden; }
    .tile:hover { transform:translateY(-2px); }
    .lock-badge { position:absolute; top:10px; right:10px; font-size:.7rem; opacity:.5; }
    .tile-preview { font-size:.7rem; color:#aaa; margin-top:6px; line-height:1.2; max-height:2.4em; overflow:hidden; }

    .tile-delete-btn {
      position:absolute;
      top:8px;
      left:8px;
      font-size:.7rem;
      background:#800;
      color:#fff;
      border:none;
      padding:2px 6px;
      cursor:pointer;
      border-radius:3px;
      opacity:.8;
    }

    .msg-block { opacity:0; transform:translateY(10px); transition:opacity .5s .2s, transform .5s .2s; margin-bottom:20px; max-width:85%; cursor:pointer; }
    .msg-block.own { align-self:flex-end; }
    .msg-block.visible { opacity:1; transform:translateY(0); }
    .msg-info { font-size:.65rem; color:#888; margin-bottom:4px; display:flex; gap:8px; text-transform:uppercase; letter-spacing:1px; }
    .msg-block.own .msg-info { justify-content:flex-end; color:var(--accent); }
    .msg-text { background:rgba(0,120,215,.1); padding:12px; border-left:3px solid var(--accent); word-break:break-word; }
    .msg-block.own .msg-text { border-left:none; border-right:3px solid #666; background:rgba(255,255,255,.05); }
    .msg-img { max-width:100%; border-radius:4px; margin-top:8px; display:block; }

    .popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:9000; display:none; align-items:center; justify-content:center; padding:20px; }
    .popup-card { background:#000; border:2px solid var(--accent); width:100%; max-width:320px; padding:25px; opacity:0; transition:opacity .4s; }
    .popup-card.visible { opacity:1; }

    .top-bar { padding:15px; display:flex; justify-content:space-between; align-items:center; height:70px; }
    .top-title { font-size:2.2rem; font-weight:100; color:var(--accent); cursor:pointer; }
    .top-actions { display:flex; gap:10px; align-items:center; }
    .top-btn { background:#111; border:1px solid #333; color:#fff; padding:6px 10px; font-size:.8rem; cursor:pointer; }

    .view-container { flex:1; overflow-y:auto; padding:10px 10px 120px; }
    .view-section { display:none; }
    .view-section.active { display:block; }
    .bottom-nav { position:fixed; bottom:0; width:100%; height:60px; display:flex; background:#000; border-top:1px solid #222; }
    .nav-btn { flex:1; display:flex; align-items:center; justify-content:center; color:#666; cursor:pointer; font-size:.8rem; letter-spacing:1px; }
    .nav-btn.active { color:#fff; border-top:3px solid var(--accent); font-weight:bold; }

    .input-box { width:100%; background:rgba(255,255,255,.08); border:1px solid #333; padding:12px; color:#fff; outline:none; margin-bottom:10px; }
    .btn-full { width:100%; padding:15px; background:var(--accent); border:none; color:#fff; cursor:pointer; font-weight:bold; text-transform:uppercase; }

    .auth-toggle-link { color:var(--accent); font-size:.8rem; margin-top:10px; text-align:center; cursor:pointer; }

    .color-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:15px 0; }
    .color-dot { width:28px; height:28px; border-radius:50%; border:2px solid #222; cursor:pointer; }
    .color-dot.selected { border-color:#fff; }

    .color-picker-input { width:100%; height:40px; padding:0; border:none; background:transparent; }

    .popup-message-text { margin:15px 0; font-size:.9rem; line-height:1.4; }
  </style>
</head>
<body>

<canvas id="canvas-dust"></canvas>

<!-- POPUP SESSION / PROFIL -->
<div class="popup-overlay" id="pop-logout">
  <div class="popup-card" id="card-logout">
    <h3>SESSION</h3>
    <p style="margin:15px 0">Que faire ?</p>
    <button class="btn-full" id="btn-logout">SE DÉCONNECTER</button>
    <button class="btn-full" style="background:#800;margin-top:10px" id="btn-delete-profile">SUPPRIMER LE PROFIL</button>
    <button class="btn-full" style="background:#222;margin-top:10px" data-close-popup>ANNULER</button>
  </div>
</div>

<!-- POPUP CRÉATION SALON -->
<div class="popup-overlay" id="pop-create">
  <div class="popup-card" id="card-create">
    <h3>NOUVEAU SALON</h3>
    <input type="text" id="new-room-name" placeholder="Nom du salon..." class="input-box" style="margin-top:15px">
    <input type="password" id="new-room-pass" placeholder="Code (optionnel)..." class="input-box">
    <button class="btn-full" id="btn-do-create">CRÉER</button>
    <button class="btn-full" style="background:#222;margin-top:10px" data-close-popup>ANNULER</button>
  </div>
</div>

<!-- POPUP OPTIONS MESSAGE -->
<div class="popup-overlay" id="pop-options">
  <div class="popup-card" id="card-options">
    <h3>OPTIONS</h3>
    <button class="btn-full" style="background:#800;margin-top:20px" id="btn-msg-del">SUPPRIMER</button>
    <button class="btn-full" style="background:#222;margin-top:10px" data-close-popup>ANNULER</button>
  </div>
</div>

<!-- POPUP ACCENT COLOR -->
<div class="popup-overlay" id="pop-accent">
  <div class="popup-card" id="card-accent">
    <h3>COULEUR D'ACCENT</h3>
    <div class="color-grid" id="accent-presets"></div>
    <button class="btn-full" id="btn-more-colors" style="margin-top:5px;background:#222;">PLUS DE COULEURS</button>
    <div id="advanced-color" style="display:none;margin-top:15px;">
      <input type="color" id="accent-picker" class="color-picker-input">
    </div>
    <button class="btn-full" style="background:#222;margin-top:15px" data-close-popup>FERMER</button>
  </div>
</div>

<!-- POPUP GENERIQUE MESSAGE -->
<div class="popup-overlay" id="pop-message">
  <div class="popup-card" id="card-message">
    <h3 id="msg-title">INFO</h3>
    <div class="popup-message-text" id="msg-text"></div>
    <button class="btn-full" id="msg-ok-btn">OK</button>
  </div>
</div>

<!-- POPUP CONFIRM -->
<div class="popup-overlay" id="pop-confirm">
  <div class="popup-card" id="card-confirm">
    <h3 id="confirm-title">CONFIRMATION</h3>
    <div class="popup-message-text" id="confirm-text"></div>
    <button class="btn-full" id="confirm-yes">OUI</button>
    <button class="btn-full" style="background:#222;margin-top:10px" id="confirm-no">ANNULER</button>
  </div>
</div>

<!-- ÉCRAN AUTH -->
<div id="auth-screen" style="height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;z-index:10;">
  <div style="font-size:3rem;color:var(--accent);text-align:center;margin-bottom:10px;font-weight:100;">thinktalk</div>
  <div id="auth-mode-title" style="color:#888;margin-bottom:20px;">Se connecter</div>
  <div style="width:300px;margin:0 auto;">
    <input type="text" id="auth-pseudo" class="input-box" placeholder="Pseudo">
    <input type="password" id="auth-code" class="input-box" placeholder="Code secret">
    <button class="btn-full" id="btn-login">SE CONNECTER</button>
    <div class="auth-toggle-link" id="auth-toggle">Vous n'avez pas de compte ? Rejoindre ThinkTalk</div>
  </div>
</div>

<!-- APP PRINCIPALE -->
<div class="app-root" id="main-app">
  <div class="top-bar">
    <div class="top-title" id="btn-open-session">thinktalk</div>
    <div class="top-actions">
      <button class="top-btn" id="btn-open-accent">Accent color</button>
    </div>
  </div>
  <div class="view-container">
    <!-- HOME / ROOMS -->
    <section id="view-home" class="view-section active">
      <div style="display:flex;gap:10px;margin-bottom:20px">
        <input type="text" id="rooms-search" class="input-box" style="margin:0" placeholder="Chercher un salon...">
        <button style="background:var(--accent);border:none;color:#fff;padding:0 20px" id="btn-open-create">+</button>
      </div>
      <div class="tiles-grid" id="rooms-grid"></div>
    </section>

    <!-- CHAT -->
    <section id="view-chat" class="view-section">
      <div id="chat-header" style="color:var(--accent);margin-bottom:15px;font-weight:bold"># général</div>
      <div id="chat-messages"></div>
      <div style="position:fixed;bottom:60px;left:0;right:0;display:flex;background:#000;padding:10px;gap:8px;border-top:1px solid #222">
        <button id="btn-attach" style="background:#222;color:#fff;border:none;padding:0 15px;cursor:pointer">📎</button>
        <input type="file" id="file-input" hidden accept="image/*">
        <input type="text" id="chat-input" class="input-box" style="margin:0" placeholder="Message...">
        <button id="send-btn" style="background:var(--accent);color:#fff;border:none;padding:0 20px">OK</button>
      </div>
    </section>

    <!-- CONTACTS -->
    <section id="view-contacts" class="view-section">
      <div style="display:flex;gap:10px;margin-bottom:10px">
        <input type="text" id="contact-name-input" class="input-box" style="margin:0" placeholder="Pseudo de l'ami...">
        <button style="background:var(--accent);border:none;color:#fff;padding:0 20px" id="btn-add-contact">+</button>
      </div>
      <input type="text" id="contacts-search" class="input-box" style="margin-bottom:15px" placeholder="Chercher un contact...">
      <div class="tiles-grid" id="contacts-grid"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <div class="nav-btn active" data-tab="home">HOME</div>
    <div class="nav-btn" data-tab="chat">CHAT</div>
    <div class="nav-btn" data-tab="contacts">CONTACTS</div>
  </nav>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, query, orderBy, where,
    serverTimestamp, getDocs, deleteDoc, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const cfg = {
    apiKey: "AIzaSyCv4nD9Nyez5ERGvW47q-6O-TA96zWJn0M",
    authDomain: "thinktalk-b3c85.firebaseapp.com",
    projectId: "thinktalk-b3c85",
    storageBucket: "thinktalk-b3c85.firebasestorage.app",
    messagingSenderId: "752141817301",
    appId: "1:752141817301:web:28fecaf81db27eb51d595c"
  };

  const app = initializeApp(cfg);
  const db = getFirestore(app);

  const byId = (id) => document.getElementById(id);
  const qsa = (sel) => Array.from(document.querySelectorAll(sel));

  let currentUser = localStorage.getItem("tt_user") || null;
  let curRoom = "général";
  let unsubChat = null;
  let selectedMsgId = null;
  let authMode = "login"; // "login" | "register"
  let confirmCallback = null;

  // pour tuiles dynamiques
  const lastMessagesByRoom = new Map();   // roomName -> [{sender,text}, ...]
  const lastMessagesByDM = new Map();     // dmKey -> [{sender,text}, ...]

  // rooms privés déjà autorisés
  let allowedRooms = [];
  try {
    allowedRooms = JSON.parse(localStorage.getItem("tt_allowedRooms") || "[]");
  } catch {
    allowedRooms = [];
  }

  // --- PARTICULES ---
  const canvas = byId("canvas-dust");
  const ctx = canvas.getContext("2d");
  let pts = [];
  const mouse = { x: -1000, y: -1000 };

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  class Particle {
    constructor() {
      this.init();
      this.target = null;
    }
    init() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.s = Math.random() * 2 + 1;
    }
    update() {
      if (this.target) {
        this.x += (this.target.x - this.x) * 0.15;
        this.y += (this.target.y - this.y) * 0.15;
        return;
      }
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 180) {
        this.vx += dx * 0.002;
        this.vy += dy * 0.002;
      }
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.99;
      this.vy *= 0.99;
      if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
      if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }
    draw() {
      ctx.fillStyle = "#0078d7cc";
      ctx.shadowBlur = 8;
      ctx.shadowColor = "#0078d7";
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  for (let i = 0; i < 400; i++) pts.push(new Particle());

  function anim() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach((p) => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(anim);
  }
  anim();

  // --- ANIMATIONS UI ---
  window.materialize = (el, delay = 0) => {
    setTimeout(() => {
      const r = el.getBoundingClientRect();
      const pCount = 30;
      const targets = [];
      for (let i = 0; i < pCount; i++) {
        targets.push({ x: r.left + (r.width / pCount) * i, y: r.top });
        targets.push({ x: r.left + (r.width / pCount) * i, y: r.bottom });
      }
      pts.forEach((p, index) => {
        if (targets[index]) p.target = targets[index];
      });
      setTimeout(() => {
        pts.forEach((p) => (p.target = null));
        el.classList.add("visible");
      }, 800);
    }, delay);
  };

  function openPopup(popId, cardId) {
    const pop = byId(popId);
    const card = byId(cardId);
    if (!pop || !card) return;
    pop.style.display = "flex";
    materialize(card);
  }

  function closePopups() {
    qsa(".popup-overlay").forEach((p) => (p.style.display = "none"));
    qsa(".popup-card").forEach((c) => c.classList.remove("visible"));
  }

  // --- POPUPS MESSAGE / CONFIRM ---
  function showMessage(text, title = "INFO") {
    byId("msg-title").innerText = title;
    byId("msg-text").innerText = text;
    openPopup("pop-message", "card-message");
  }

  function showConfirm(text, onYes, title = "CONFIRMATION") {
    confirmCallback = onYes;
    byId("confirm-title").innerText = title;
    byId("confirm-text").innerText = text;
    openPopup("pop-confirm", "card-confirm");
  }

  // --- SESSION ---
  function logout() {
    localStorage.removeItem("tt_user");
    location.reload();
  }

  async function deleteProfile() {
    if (!currentUser) return;
    showConfirm("Supprimer définitivement le profil et les contacts liés ?", async () => {
      try {
        await deleteDoc(doc(db, "users", currentUser));
        const contactsRef = collection(db, "contacts");
        const q1 = query(contactsRef, where("owner", "==", currentUser));
        const q2 = query(contactsRef, where("name", "==", currentUser));
        const [snap1, snap2] = await Promise.all([getDocs(q1), getDocs(q2)]);
        snap1.forEach((d) => deleteDoc(doc(db, "contacts", d.id)));
        snap2.forEach((d) => deleteDoc(doc(db, "contacts", d.id)));
        localStorage.removeItem("tt_user");
        showMessage("Profil supprimé.");
        setTimeout(() => location.reload(), 800);
      } catch (e) {
        console.error(e);
        showMessage("Erreur lors de la suppression du profil.");
      }
    });
  }

  // --- TABS ---
  function switchTab(tab) {
    const appRoot = byId("main-app");
    appRoot.classList.add("view-blur");
    qsa(".nav-btn").forEach((b) => b.classList.remove("active"));
    const btn = qsa(".nav-btn").find((b) => b.dataset.tab === tab);
    if (btn) btn.classList.add("active");
    setTimeout(() => {
      qsa(".view-section").forEach((s) => s.classList.remove("active"));
      const view = byId("view-" + tab);
      if (view) view.classList.add("active");
      appRoot.classList.remove("view-blur");
      if (tab === "chat") {
        qsa(".msg-block").forEach((m, i) => {
          m.classList.remove("visible");
          materialize(m, i * 80);
        });
      }
    }, 400);
  }

  // --- AUTH ---
  function updateAuthUI() {
    const title = byId("auth-mode-title");
    const btn = byId("btn-login");
    const toggle = byId("auth-toggle");
    if (authMode === "login") {
      title.innerText = "Se connecter";
      btn.innerText = "SE CONNECTER";
      toggle.innerText = "Vous n'avez pas de compte ? Rejoindre ThinkTalk";
    } else {
      title.innerText = "Créer un compte";
      btn.innerText = "CRÉER UN COMPTE";
      toggle.innerText = "Vous avez déjà un compte ? Se connecter";
    }
  }

  async function handleLogin() {
    const p = byId("auth-pseudo").value.trim().toLowerCase();
    const c = byId("auth-code").value.trim();
    if (!p || !c) {
      showMessage("Pseudo et code requis.");
      return;
    }
    try {
      const uRef = doc(db, "users", p);
      const uDoc = await getDoc(uRef);
      if (authMode === "login") {
        if (uDoc.exists()) {
          if (uDoc.data().code === c) {
            localStorage.setItem("tt_user", p);
            location.reload();
          } else {
            showMessage("Code secret incorrect.");
          }
        } else {
          showMessage("Ce compte n'existe pas.");
        }
      } else {
        if (uDoc.exists()) {
          showMessage("Ce pseudo est déjà utilisé.");
          return;
        }
        await setDoc(uRef, { code: c });
        localStorage.setItem("tt_user", p);
        location.reload();
      }
    } catch (e) {
      console.error(e);
      showMessage("Erreur de connexion.");
    }
  }

  // --- ROOMS & CHAT ---
  async function enterRoom(name, isPrivateChat = false) {
    if (!currentUser) {
      showMessage("Connecte-toi d'abord.");
      return;
    }

    if (!isPrivateChat) {
      const rSnap = await getDocs(
        query(collection(db, "rooms"), where("name", "==", name))
      );
      if (!rSnap.empty) {
        const roomDoc = rSnap.docs[0];
        const roomData = roomDoc.data();
        const pass = roomData.pass || "";
        const owner = roomData.owner || null;

        if (pass && pass !== "") {
          const roomKey = name;
          const alreadyAllowed = allowedRooms.includes(roomKey);
          const isOwner = owner === currentUser;

          if (!alreadyAllowed && !isOwner) {
            // popup pour code
            let inputCode = "";
            const inputId = "room-pass-input";
            const html = `
              <div style="margin-top:10px">
                <input id="${inputId}" type="password" class="input-box" placeholder="Code du salon">
              </div>
            `;
            byId("msg-title").innerText = "Salon privé";
            byId("msg-text").innerHTML = "Ce salon est privé. Entrez le code :" + html;
            openPopup("pop-message", "card-message");
            const okBtn = byId("msg-ok-btn");
            const oldHandler = okBtn.onclick;
            okBtn.onclick = async () => {
              const inp = byId(inputId);
              inputCode = inp.value.trim();
              closePopups();
              okBtn.onclick = oldHandler || null;
              if (inputCode !== pass) {
                showMessage("Code erroné.");
                return;
              }
              allowedRooms.push(roomKey);
              localStorage.setItem("tt_allowedRooms", JSON.stringify(allowedRooms));
              proceedEnter();
            };
            return;
          }
        }
      }
    }

    proceedEnter();

    function proceedEnter() {
      curRoom = isPrivateChat ? [currentUser, name].sort().join("_") : name;
      byId("chat-header").innerText = isPrivateChat ? "@ " + name : "# " + name;
      switchTab("chat");

      if (unsubChat) unsubChat();

      const qMsg = query(
        collection(db, "messages"),
        where("room", "==", curRoom),
        orderBy("timestamp", "asc")
      );

      unsubChat = onSnapshot(qMsg, (snap) => {
        const box = byId("chat-messages");
        box.innerHTML = "";
        snap.forEach((d) => {
          const m = d.data();
          const date = m.timestamp?.seconds
            ? new Date(m.timestamp.seconds * 1000)
            : new Date();
          const hh = String(date.getHours()).padStart(2, "0");
          const mm = String(date.getMinutes()).padStart(2, "0");
          const timeStr = `${hh}:${mm}`;

          const div = document.createElement("div");
          div.className = "msg-block" + (m.sender === currentUser ? " own" : "");

          const info = document.createElement("div");
          info.className = "msg-info";
          info.innerHTML = `<span>${m.sender}</span><span>${timeStr}</span>`;

          const content = document.createElement("div");
          content.className = "msg-text";
          if (m.image) {
            const img = document.createElement("img");
            img.src = m.image;
            img.className = "msg-img";
            content.appendChild(img);
          } else {
            content.textContent = m.text || "";
          }

          div.appendChild(info);
          div.appendChild(content);

          if (m.sender === currentUser) {
            div.onclick = () => {
              selectedMsgId = d.id;
              openPopup("pop-options", "card-options");
            };
          }

          box.appendChild(div);
          div.classList.add("visible");
        });
        box.parentElement.scrollTop = box.parentElement.scrollHeight;
      });
    }
  }

  async function createRoom() {
    const name = byId("new-room-name").value.trim();
    const pass = byId("new-room-pass").value.trim();
    if (!name) return;
    if (!currentUser) {
      showMessage("Connecte-toi d'abord.");
      return;
    }
    try {
      await addDoc(collection(db, "rooms"), { name, pass, owner: currentUser });
      closePopups();
      byId("new-room-name").value = "";
      byId("new-room-pass").value = "";
    } catch (e) {
      console.error(e);
      showMessage("Erreur lors de la création du salon.");
    }
  }

  async function sendMessage() {
    if (!currentUser) {
      showMessage("Connecte-toi d'abord.");
      return;
    }
    const i = byId("chat-input");
    const text = i.value.trim();
    if (!text) return;
    try {
      await addDoc(collection(db, "messages"), {
        text,
        room: curRoom,
        sender: currentUser,
        timestamp: serverTimestamp()
      });
      i.value = "";
    } catch (e) {
      console.error(e);
      showMessage("Erreur lors de l'envoi du message.");
    }
  }

  function sendImage(file) {
    if (!file || !currentUser) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        await addDoc(collection(db, "messages"), {
          image: ev.target.result,
          room: curRoom,
          sender: currentUser,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error(err);
        showMessage("Erreur lors de l'envoi de l'image.");
      }
    };
    reader.readAsDataURL(file);
  }

  async function deleteMessage() {
    if (!selectedMsgId) return;
    try {
      await deleteDoc(doc(db, "messages", selectedMsgId));
    } catch (e) {
      console.error(e);
      showMessage("Impossible de supprimer le message (règles Firestore ?).");
    }
    closePopups();
    selectedMsgId = null;
  }

  // --- CONTACTS ---
  async function addContact() {
    if (!currentUser) {
      showMessage("Connecte-toi d'abord.");
      return;
    }
    const name = byId("contact-name-input").value.trim().toLowerCase();
    if (!name || name === currentUser) return;
    try {
      const uRef = doc(db, "users", name);
      const uDoc = await getDoc(uRef);
      if (!uDoc.exists()) {
        showMessage("Ce contact n'existe pas sur ThinkTalk.");
        return;
      }
      await addDoc(collection(db, "contacts"), { owner: currentUser, name });
      byId("contact-name-input").value = "";
    } catch (e) {
      console.error(e);
      showMessage("Erreur lors de l'ajout du contact.");
    }
  }

  // --- SNAPSHOTS ROOMS / CONTACTS / MESSAGES ---
  function normalize(str) {
    return (str || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  function setupMessagesSnapshot() {
    const qAll = query(collection(db, "messages"), orderBy("timestamp", "asc"));
    onSnapshot(qAll, (snap) => {
      lastMessagesByRoom.clear();
      lastMessagesByDM.clear();
      snap.forEach((d) => {
        const m = d.data();
        const room = m.room;
        if (!room) return;
        const entry = { sender: m.sender, text: m.text || (m.image ? "[image]" : "") };

        // DM ou room ?
        if (room.includes("_") && !room.includes(" ")) {
          // DM
          const arr = lastMessagesByDM.get(room) || [];
          arr.push(entry);
          if (arr.length > 2) arr.shift();
          lastMessagesByDM.set(room, arr);
        } else {
          const arr = lastMessagesByRoom.get(room) || [];
          arr.push(entry);
          if (arr.length > 2) arr.shift();
          lastMessagesByRoom.set(room, arr);
        }
      });
      // refresh tuiles
      renderRoomsTiles();
      renderContactsTiles();
    });
  }

  function renderRoomsTiles() {
    const g = byId("rooms-grid");
    if (!g) return;
    g.innerHTML = "";
    const search = normalize(byId("rooms-search").value.trim());
    roomsCache.forEach((r) => {
      if (!r.name) return;
      const nameNorm = normalize(r.name);
      const previews = lastMessagesByRoom.get(r.name) || [];
      const previewText = previews
        .map((m) => `${m.sender}: ${m.text}`)
        .join(" • ")
        .slice(0, 80);

      const haystack = nameNorm + " " + normalize(previewText);
      if (search && !haystack.includes(search)) return;

      const t = document.createElement("div");
      t.className = "tile";
      t.innerHTML = `<div><span># ${r.name}</span>${r.pass ? '<span class="lock-badge">🔒</span>' : ""}</div>
                     <div class="tile-preview">${previewText || ""}</div>`;

      // suppression salon (seulement owner)
      if (r.owner === currentUser) {
        const delBtn = document.createElement("button");
        delBtn.className = "tile-delete-btn";
        delBtn.textContent = "Suppr.";
        delBtn.onclick = (ev) => {
          ev.stopPropagation();
          showConfirm(`Supprimer le salon #${r.name} ?`, async () => {
            try {
              await deleteDoc(doc(db, "rooms", r._id));
            } catch (e) {
              console.error(e);
              showMessage("Erreur lors de la suppression du salon.");
            }
          });
        };
        t.appendChild(delBtn);
      }

      // long press mobile
      let pressTimer = null;
      t.addEventListener("pointerdown", (e) => {
        if (r.owner === currentUser) {
          pressTimer = setTimeout(() => {
            showConfirm(`Supprimer le salon #${r.name} ?`, async () => {
              try {
                await deleteDoc(doc(db, "rooms", r._id));
              } catch (e) {
                console.error(e);
                showMessage("Erreur lors de la suppression du salon.");
              }
            });
          }, 600);
        }
      });
      t.addEventListener("pointerup", () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      });
      t.addEventListener("pointerleave", () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      });

      t.onclick = () => enterRoom(r.name);
      g.appendChild(t);
    });
  }

  let roomsCache = [];

  function setupRoomsSnapshot() {
    onSnapshot(collection(db, "rooms"), (snap) => {
      roomsCache = [];
      snap.forEach((d) => {
        const r = d.data();
        roomsCache.push({ ...r, _id: d.id });
      });
      renderRoomsTiles();
    });
  }

  function renderContactsTiles() {
    const g = byId("contacts-grid");
    if (!g || !currentUser) return;
    g.innerHTML = "";
    const search = normalize(byId("contacts-search").value.trim());
    const list = new Set();
    contactsCache.forEach((c) => {
      if (!c.owner || !c.name) return;
      if (c.owner === currentUser) list.add(c.name);
      if (c.name === currentUser) list.add(c.owner);
    });

    list.forEach((name) => {
      const dmKey = [currentUser, name].sort().join("_");
      const previews = lastMessagesByDM.get(dmKey) || [];
      const previewText = previews
        .map((m) => `${m.sender}: ${m.text}`)
        .join(" • ")
        .slice(0, 80);

      const haystack = normalize(name) + " " + normalize(previewText);
      if (search && !haystack.includes(search)) return;

      const t = document.createElement("div");
      t.className = "tile";
      t.innerHTML = `<div><span>@ ${name}</span></div>
                     <div class="tile-preview">${previewText || ""}</div>`;

      // suppression contact (seulement si owner = currentUser)
      const contactObj = contactsCache.find(
        (c) => (c.owner === currentUser && c.name === name)
      );
      if (contactObj) {
        const delBtn = document.createElement("button");
        delBtn.className = "tile-delete-btn";
        delBtn.textContent = "Suppr.";
        delBtn.onclick = (ev) => {
          ev.stopPropagation();
          showConfirm(`Supprimer le contact @${name} ?`, async () => {
            try {
              await deleteDoc(doc(db, "contacts", contactObj._id));
            } catch (e) {
              console.error(e);
              showMessage("Erreur lors de la suppression du contact.");
            }
          });
        };
        t.appendChild(delBtn);

        let pressTimer = null;
        t.addEventListener("pointerdown", () => {
          pressTimer = setTimeout(() => {
            showConfirm(`Supprimer le contact @${name} ?`, async () => {
              try {
                await deleteDoc(doc(db, "contacts", contactObj._id));
              } catch (e) {
                console.error(e);
                showMessage("Erreur lors de la suppression du contact.");
              }
            });
          }, 600);
        });
        t.addEventListener("pointerup", () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        });
        t.addEventListener("pointerleave", () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        });
      }

      t.onclick = () => enterRoom(name, true);
      g.appendChild(t);
    });
  }

  let contactsCache = [];

  function setupContactsSnapshot() {
    onSnapshot(collection(db, "contacts"), (snap) => {
      contactsCache = [];
      snap.forEach((d) => {
        const c = d.data();
        contactsCache.push({ ...c, _id: d.id });
      });
      renderContactsTiles();
    });
  }

  // --- ACCENT COLOR ---
  function applyAccent(color) {
    document.documentElement.style.setProperty("--accent", color);
    localStorage.setItem("tt_accent", color);
  }

  function initAccent() {
    const saved = localStorage.getItem("tt_accent");
    if (saved) applyAccent(saved);
    const presets = [
      "#0078d7",
      "#8e44ad",
      "#27ae60",
      "#e67e22",
      "#e91e63",
      "#ff4757",
      "#1abc9c",
      "#f1c40f",
      "#3498db",
      "#9b59b6"
    ];
    const grid = byId("accent-presets");
    presets.forEach((c) => {
      const dot = document.createElement("div");
      dot.className = "color-dot";
      dot.style.background = c;
      if (saved === c) dot.classList.add("selected");
      dot.onclick = () => {
        qsa(".color-dot").forEach((d) => d.classList.remove("selected"));
        dot.classList.add("selected");
        applyAccent(c);
      };
      grid.appendChild(dot);
    });

    byId("btn-more-colors").onclick = () => {
      const adv = byId("advanced-color");
      adv.style.display = adv.style.display === "none" ? "block" : "none";
    };

    const picker = byId("accent-picker");
    picker.value = saved || "#0078d7";
    picker.oninput = () => {
      applyAccent(picker.value);
    };
  }

  // --- INIT UI & EVENTS ---
  function initUI() {
    // nav
    qsa(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    // popups
    byId("btn-open-session").addEventListener("click", () => openPopup("pop-logout", "card-logout"));
    byId("btn-open-create").addEventListener("click", () => openPopup("pop-create", "card-create"));
    byId("btn-open-accent").addEventListener("click", () => openPopup("pop-accent", "card-accent"));
    qsa("[data-close-popup]").forEach((b) => b.addEventListener("click", closePopups));

    // session
    byId("btn-logout").addEventListener("click", logout);
    byId("btn-delete-profile").addEventListener("click", deleteProfile);

    // message popup
    byId("msg-ok-btn").addEventListener("click", closePopups);

    // confirm popup
    byId("confirm-yes").addEventListener("click", () => {
      if (confirmCallback) confirmCallback();
      confirmCallback = null;
      closePopups();
    });
    byId("confirm-no").addEventListener("click", () => {
      confirmCallback = null;
      closePopups();
    });

    // auth
    byId("btn-login").addEventListener("click", handleLogin);
    byId("auth-code").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });
    byId("auth-toggle").addEventListener("click", () => {
      authMode = authMode === "login" ? "register" : "login";
      updateAuthUI();
    });

    // rooms
    byId("btn-do-create").addEventListener("click", createRoom);
    byId("rooms-search").addEventListener("input", () => {
      renderRoomsTiles();
    });

    // chat
    byId("send-btn").addEventListener("click", sendMessage);
    byId("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    byId("btn-attach").addEventListener("click", () => byId("file-input").click());
    byId("file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) sendImage(file);
      e.target.value = "";
    });
    byId("btn-msg-del").addEventListener("click", deleteMessage);

    // contacts
    byId("btn-add-contact").addEventListener("click", addContact);
    byId("contacts-search").addEventListener("input", () => {
      renderContactsTiles();
    });

    initAccent();
    updateAuthUI();
  }

  function initApp() {
    initUI();
    setupRoomsSnapshot();
    setupContactsSnapshot();
    setupMessagesSnapshot();

    if (currentUser) {
      byId("auth-screen").style.display = "none";
      const appRoot = byId("main-app");
      appRoot.style.display = "flex";
      enterRoom("général");
    }
  }

  initApp();
</script>
</body>
</html>
