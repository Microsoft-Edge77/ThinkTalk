<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ThinkTalk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root { --accent:#0078d7; --bg:#000; --text:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:"Segoe UI",sans-serif; }
    body { background:var(--bg); color:var(--text); overflow:hidden; height:100svh; position:fixed; width:100%; }
    #canvas-dust { position:fixed; inset:0; z-index:0; pointer-events:none; }

    .app-root { position:relative; z-index:1; height:100%; display:none; flex-direction:column; transition:transform .6s cubic-bezier(.4,0,.2,1), filter .6s; }
    .view-blur { filter:blur(25px); transform:translateX(-30px); }

    .tiles-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .tile { position:relative; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); padding:15px; height:110px; display:flex; flex-direction:column; justify-content:flex-end; cursor:pointer; backdrop-filter:blur(10px); transition:transform .4s, opacity .4s; overflow:hidden; }
    .lock-badge { position:absolute; top:10px; right:10px; font-size:.7rem; opacity:.5; }

    .msg-block { opacity:0; transform:translateY(10px); transition:opacity .5s .2s, transform .5s .2s; margin-bottom:20px; max-width:85%; cursor:pointer; }
    .msg-block.own { align-self:flex-end; }
    .msg-block.visible { opacity:1; transform:translateY(0); }
    .msg-info { font-size:.65rem; color:#888; margin-bottom:4px; display:flex; gap:8px; text-transform:uppercase; letter-spacing:1px; }
    .msg-block.own .msg-info { justify-content:flex-end; color:var(--accent); }
    .msg-text { background:rgba(0,120,215,.1); padding:12px; border-left:3px solid var(--accent); word-break:break-word; }
    .msg-block.own .msg-text { border-left:none; border-right:3px solid #666; background:rgba(255,255,255,.05); }
    .msg-img { max-width:100%; border-radius:4px; margin-top:8px; display:block; }

    .popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:9000; display:none; align-items:center; justify-content:center; padding:20px; }
    .popup-card { background:#000; border:2px solid var(--accent); width:100%; max-width:320px; padding:25px; opacity:0; transition:opacity .4s; }
    .popup-card.visible { opacity:1; }

    .top-bar { padding:15px; display:flex; justify-content:space-between; align-items:center; height:70px; }
    .top-title { font-size:2.2rem; font-weight:100; color:var(--accent); cursor:pointer; }
    .view-container { flex:1; overflow-y:auto; padding:10px 10px 120px; }
    .view-section { display:none; }
    .view-section.active { display:block; }
    .bottom-nav { position:fixed; bottom:0; width:100%; height:60px; display:flex; background:#000; border-top:1px solid #222; }
    .nav-btn { flex:1; display:flex; align-items:center; justify-content:center; color:#666; cursor:pointer; font-size:.8rem; letter-spacing:1px; }
    .nav-btn.active { color:#fff; border-top:3px solid var(--accent); font-weight:bold; }

    .input-box { width:100%; background:rgba(255,255,255,.08); border:1px solid #333; padding:12px; color:#fff; outline:none; margin-bottom:10px; }
    .btn-full { width:100%; padding:15px; background:var(--accent); border:none; color:#fff; cursor:pointer; font-weight:bold; text-transform:uppercase; }
  </style>
</head>
<body>

<canvas id="canvas-dust"></canvas>

<!-- POPUP SESSION / PROFIL -->
<div class="popup-overlay" id="pop-logout">
  <div class="popup-card" id="card-logout">
    <h3>SESSION</h3>
    <p style="margin:15px 0">Que faire ?</p>
    <button class="btn-full" id="btn-logout">SE DÉCONNECTER</button>
    <button class="btn-full" style="background:#800;margin-top:10px" id="btn-delete-profile">SUPPRIMER LE PROFIL</button>
    <button class="btn-full" style="background:#222;margin-top:10px" data-close-popup>ANNULER</button>
  </div>
</div>

<!-- POPUP CRÉATION SALON -->
<div class="popup-overlay" id="pop-create">
  <div class="popup-card" id="card-create">
    <h3>NOUVEAU SALON</h3>
    <input type="text" id="new-room-name" placeholder="Nom du salon..." class="input-box" style="margin-top:15px">
    <input type="password" id="new-room-pass" placeholder="Code (optionnel)..." class="input-box">
    <button class="btn-full" id="btn-do-create">CRÉER</button>
    <button class="btn-full" style="background:#222;margin-top:10px" data-close-popup>ANNULER</button>
  </div>
</div>

<!-- POPUP OPTIONS MESSAGE -->
<div class="popup-overlay" id="pop-options">
  <div class="popup-card" id="card-options">
    <h3>OPTIONS</h3>
    <button class="btn-full" style="background:#800;margin-top:20px" id="btn-msg-del">SUPPRIMER</button>
    <button class="btn-full" style="background:#222;margin-top:10px" data-close-popup>ANNULER</button>
  </div>
</div>

<!-- ÉCRAN AUTH -->
<div id="auth-screen" style="height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;z-index:10;">
  <div style="font-size:3rem;color:var(--accent);text-align:center;margin-bottom:30px;font-weight:100;">thinktalk</div>
  <div style="width:300px;margin:0 auto;">
    <input type="text" id="auth-pseudo" class="input-box" placeholder="Pseudo">
    <input type="password" id="auth-code" class="input-box" placeholder="Code secret">
    <button class="btn-full" id="btn-login">ENTRER</button>
  </div>
</div>

<!-- APP PRINCIPALE -->
<div class="app-root" id="main-app">
  <div class="top-bar">
    <div class="top-title" id="btn-open-session">thinktalk</div>
  </div>
  <div class="view-container">
    <!-- HOME / ROOMS -->
    <section id="view-home" class="view-section active">
      <div style="display:flex;gap:10px;margin-bottom:20px">
        <input type="text" id="rooms-search" class="input-box" style="margin:0" placeholder="Chercher...">
        <button style="background:var(--accent);border:none;color:#fff;padding:0 20px" id="btn-open-create">+</button>
      </div>
      <div class="tiles-grid" id="rooms-grid"></div>
    </section>

    <!-- CHAT -->
    <section id="view-chat" class="view-section">
      <div id="chat-header" style="color:var(--accent);margin-bottom:15px;font-weight:bold"># général</div>
      <div id="chat-messages"></div>
      <div style="position:fixed;bottom:60px;left:0;right:0;display:flex;background:#000;padding:10px;gap:8px;border-top:1px solid #222">
        <button id="btn-attach" style="background:#222;color:#fff;border:none;padding:0 15px;cursor:pointer">📎</button>
        <input type="file" id="file-input" hidden accept="image/*">
        <input type="text" id="chat-input" class="input-box" style="margin:0" placeholder="Message...">
        <button id="send-btn" style="background:var(--accent);color:#fff;border:none;padding:0 20px">OK</button>
      </div>
    </section>

    <!-- CONTACTS -->
    <section id="view-contacts" class="view-section">
      <div style="display:flex;gap:10px;margin-bottom:20px">
        <input type="text" id="contact-name-input" class="input-box" style="margin:0" placeholder="Pseudo de l'ami...">
        <button style="background:var(--accent);border:none;color:#fff;padding:0 20px" id="btn-add-contact">+</button>
      </div>
      <div class="tiles-grid" id="contacts-grid"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <div class="nav-btn active" data-tab="home">HOME</div>
    <div class="nav-btn" data-tab="chat">CHAT</div>
    <div class="nav-btn" data-tab="contacts">CONTACTS</div>
  </nav>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, query, orderBy, where,
    serverTimestamp, getDocs, deleteDoc, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const cfg = {
    apiKey: "AIzaSyCv4nD9Nyez5ERGvW47q-6O-TA96zWJn0M",
    authDomain: "thinktalk-b3c85.firebaseapp.com",
    projectId: "thinktalk-b3c85",
    storageBucket: "thinktalk-b3c85.firebasestorage.app",
    messagingSenderId: "752141817301",
    appId: "1:752141817301:web:28fecaf81db27eb51d595c"
  };

  const app = initializeApp(cfg);
  const db = getFirestore(app);

  const byId = (id) => document.getElementById(id);
  const qsa = (sel) => Array.from(document.querySelectorAll(sel));

  let currentUser = localStorage.getItem("tt_user") || null;
  let curRoom = "général";
  let unsubChat = null;
  let selectedMsgId = null;

  // --- PARTICULES ---
  const canvas = byId("canvas-dust");
  const ctx = canvas.getContext("2d");
  let pts = [];
  const mouse = { x: -1000, y: -1000 };

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  class Particle {
    constructor() {
      this.init();
      this.target = null;
    }
    init() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.s = Math.random() * 2 + 1;
    }
    update() {
      if (this.target) {
        this.x += (this.target.x - this.x) * 0.15;
        this.y += (this.target.y - this.y) * 0.15;
        return;
      }
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 180) {
        this.vx += dx * 0.002;
        this.vy += dy * 0.002;
      }
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.99;
      this.vy *= 0.99;
      if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
      if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }
    draw() {
      ctx.fillStyle = "#0078d7cc";
      ctx.shadowBlur = 8;
      ctx.shadowColor = "#0078d7";
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  for (let i = 0; i < 400; i++) pts.push(new Particle());

  function anim() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach((p) => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(anim);
  }
  anim();

  // --- ANIMATIONS UI ---
  window.materialize = (el, delay = 0) => {
    setTimeout(() => {
      const r = el.getBoundingClientRect();
      const pCount = 30;
      const targets = [];
      for (let i = 0; i < pCount; i++) {
        targets.push({ x: r.left + (r.width / pCount) * i, y: r.top });
        targets.push({ x: r.left + (r.width / pCount) * i, y: r.bottom });
      }
      pts.forEach((p, index) => {
        if (targets[index]) p.target = targets[index];
      });
      setTimeout(() => {
        pts.forEach((p) => (p.target = null));
        el.classList.add("visible");
      }, 800);
    }, delay);
  };

  function openPopup(popId, cardId) {
    const pop = byId(popId);
    const card = byId(cardId);
    if (!pop || !card) return;
    pop.style.display = "flex";
    materialize(card);
  }

  function closePopups() {
    qsa(".popup-overlay").forEach((p) => (p.style.display = "none"));
    qsa(".popup-card").forEach((c) => c.classList.remove("visible"));
  }

  // --- SESSION ---
  function logout() {
    localStorage.removeItem("tt_user");
    location.reload();
  }

  async function deleteProfile() {
    if (!currentUser) return;
    if (!confirm("Supprimer définitivement le profil et les contacts liés ?")) return;
    try {
      await deleteDoc(doc(db, "users", currentUser));
      const contactsRef = collection(db, "contacts");
      const q1 = query(contactsRef, where("owner", "==", currentUser));
      const q2 = query(contactsRef, where("name", "==", currentUser));
      const [snap1, snap2] = await Promise.all([getDocs(q1), getDocs(q2)]);
      snap1.forEach((d) => deleteDoc(doc(db, "contacts", d.id)));
      snap2.forEach((d) => deleteDoc(doc(db, "contacts", d.id)));
      localStorage.removeItem("tt_user");
      alert("Profil supprimé.");
      location.reload();
    } catch (e) {
      console.error(e);
      alert("Erreur lors de la suppression du profil.");
    }
  }

  // --- TABS ---
  function switchTab(tab) {
    const appRoot = byId("main-app");
    appRoot.classList.add("view-blur");
    qsa(".nav-btn").forEach((b) => b.classList.remove("active"));
    const btn = qsa(".nav-btn").find((b) => b.dataset.tab === tab);
    if (btn) btn.classList.add("active");
    setTimeout(() => {
      qsa(".view-section").forEach((s) => s.classList.remove("active"));
      const view = byId("view-" + tab);
      if (view) view.classList.add("active");
      appRoot.classList.remove("view-blur");
      if (tab === "chat") {
        qsa(".msg-block").forEach((m, i) => {
          m.classList.remove("visible");
          materialize(m, i * 80);
        });
      }
    }, 400);
  }

  // --- AUTH ---
  async function handleLogin() {
    const p = byId("auth-pseudo").value.trim().toLowerCase();
    const c = byId("auth-code").value.trim();
    if (!p || !c) {
      alert("Pseudo et code requis.");
      return;
    }
    try {
      const uRef = doc(db, "users", p);
      const uDoc = await getDoc(uRef);
      if (uDoc.exists()) {
        if (uDoc.data().code === c) {
          localStorage.setItem("tt_user", p);
          location.reload();
        } else {
          alert("Code secret incorrect.");
        }
      } else {
        await setDoc(uRef, { code: c });
        localStorage.setItem("tt_user", p);
        location.reload();
      }
    } catch (e) {
      console.error(e);
      alert("Erreur de connexion.");
    }
  }

  // --- ROOMS & CHAT ---
  async function enterRoom(name, isPrivateChat = false) {
    if (!currentUser) {
      alert("Connecte-toi d'abord.");
      return;
    }

    if (!isPrivateChat) {
      const rSnap = await getDocs(
        query(collection(db, "rooms"), where("name", "==", name))
      );
      if (!rSnap.empty) {
        const roomData = rSnap.docs[0].data();
        if (roomData.pass && roomData.pass !== "") {
          const code = prompt("Salon privé. Entrez le code :");
          if (code !== roomData.pass) {
            alert("Code erroné.");
            return;
          }
        }
      }
    }

    curRoom = isPrivateChat ? [currentUser, name].sort().join("_") : name;
    byId("chat-header").innerText = isPrivateChat ? "@ " + name : "# " + name;
    switchTab("chat");

    if (unsubChat) unsubChat();

    const q = query(
      collection(db, "messages"),
      where("room", "==", curRoom),
      orderBy("timestamp", "asc")
    );

    unsubChat = onSnapshot(q, (snap) => {
      const box = byId("chat-messages");
      box.innerHTML = "";
      snap.forEach((d) => {
        const m = d.data();
        const date = m.timestamp?.seconds
          ? new Date(m.timestamp.seconds * 1000)
          : new Date();
        const hh = String(date.getHours()).padStart(2, "0");
        const mm = String(date.getMinutes()).padStart(2, "0");
        const timeStr = `${hh}:${mm}`;

        const div = document.createElement("div");
        div.className = "msg-block" + (m.sender === currentUser ? " own" : "");

        const info = document.createElement("div");
        info.className = "msg-info";
        info.innerHTML = `<span>${m.sender}</span><span>${timeStr}</span>`;

        const content = document.createElement("div");
        content.className = "msg-text";
        if (m.image) {
          const img = document.createElement("img");
          img.src = m.image;
          img.className = "msg-img";
          content.appendChild(img);
        } else {
          content.textContent = m.text || "";
        }

        div.appendChild(info);
        div.appendChild(content);

        if (m.sender === currentUser) {
          div.onclick = () => {
            selectedMsgId = d.id;
            openPopup("pop-options", "card-options");
          };
        }

        box.appendChild(div);
        div.classList.add("visible");
      });
      box.parentElement.scrollTop = box.parentElement.scrollHeight;
    });
  }

  async function createRoom() {
    const name = byId("new-room-name").value.trim();
    const pass = byId("new-room-pass").value.trim();
    if (!name) return;
    try {
      await addDoc(collection(db, "rooms"), { name, pass });
      closePopups();
      byId("new-room-name").value = "";
      byId("new-room-pass").value = "";
    } catch (e) {
      console.error(e);
      alert("Erreur lors de la création du salon.");
    }
  }

  async function sendMessage() {
    if (!currentUser) {
      alert("Connecte-toi d'abord.");
      return;
    }
    const i = byId("chat-input");
    const text = i.value.trim();
    if (!text) return;
    try {
      await addDoc(collection(db, "messages"), {
        text,
        room: curRoom,
        sender: currentUser,
        timestamp: serverTimestamp()
      });
      i.value = "";
    } catch (e) {
      console.error(e);
      alert("Erreur lors de l'envoi du message.");
    }
  }

  function sendImage(file) {
    if (!file || !currentUser) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        await addDoc(collection(db, "messages"), {
          image: ev.target.result,
          room: curRoom,
          sender: currentUser,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error(err);
        alert("Erreur lors de l'envoi de l'image.");
      }
    };
    reader.readAsDataURL(file);
  }

  async function deleteMessage() {
    if (!selectedMsgId) return;
    try {
      await deleteDoc(doc(db, "messages", selectedMsgId));
    } catch (e) {
      console.error(e);
      alert("Impossible de supprimer le message (règles Firestore ?).");
    }
    closePopups();
    selectedMsgId = null;
  }

  // --- CONTACTS ---
  async function addContact() {
    if (!currentUser) {
      alert("Connecte-toi d'abord.");
      return;
    }
    const name = byId("contact-name-input").value.trim().toLowerCase();
    if (!name || name === currentUser) return;
    try {
      await addDoc(collection(db, "contacts"), { owner: currentUser, name });
      byId("contact-name-input").value = "";
    } catch (e) {
      console.error(e);
      alert("Erreur lors de l'ajout du contact.");
    }
  }

  // --- SNAPSHOTS ---
  function setupRoomsSnapshot() {
    onSnapshot(collection(db, "rooms"), (snap) => {
      const g = byId("rooms-grid");
      g.innerHTML = "";
      const search = byId("rooms-search").value.trim().toLowerCase();
      snap.forEach((d) => {
        const r = d.data();
        if (!r.name) return;
        if (search && !r.name.toLowerCase().includes(search)) return;
        const t = document.createElement("div");
        t.className = "tile";
        t.innerHTML = `<span># ${r.name}</span>${r.pass ? '<span class="lock-badge">🔒</span>' : ""}`;
        t.onclick = () => enterRoom(r.name);
        g.appendChild(t);
      });
    });
  }

  function setupContactsSnapshot() {
    onSnapshot(collection(db, "contacts"), (snap) => {
      const g = byId("contacts-grid");
      g.innerHTML = "";
      if (!currentUser) return;
      const list = new Set();
      snap.forEach((d) => {
        const c = d.data();
        if (!c.owner || !c.name) return;
        if (c.owner === currentUser) list.add(c.name);
        if (c.name === currentUser) list.add(c.owner);
      });
      list.forEach((name) => {
        const t = document.createElement("div");
        t.className = "tile";
        t.innerHTML = `<span>@ ${name}</span>`;
        t.onclick = () => enterRoom(name, true);
        g.appendChild(t);
      });
    });
  }

  // --- INIT UI & EVENTS ---
  function initUI() {
    // nav
    qsa(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    // popups
    byId("btn-open-session").addEventListener("click", () => openPopup("pop-logout", "card-logout"));
    byId("btn-open-create").addEventListener("click", () => openPopup("pop-create", "card-create"));
    qsa("[data-close-popup]").forEach((b) => b.addEventListener("click", closePopups));

    // session
    byId("btn-logout").addEventListener("click", logout);
    byId("btn-delete-profile").addEventListener("click", deleteProfile);

    // auth
    byId("btn-login").addEventListener("click", handleLogin);
    byId("auth-code").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });

    // rooms
    byId("btn-do-create").addEventListener("click", createRoom);
    byId("rooms-search").addEventListener("input", () => {
      // filtrage géré dans snapshot via valeur actuelle
    });

    // chat
    byId("send-btn").addEventListener("click", sendMessage);
    byId("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    byId("btn-attach").addEventListener("click", () => byId("file-input").click());
    byId("file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) sendImage(file);
      e.target.value = "";
    });
    byId("btn-msg-del").addEventListener("click", deleteMessage);

    // contacts
    byId("btn-add-contact").addEventListener("click", addContact);
  }

  function initApp() {
    initUI();
    setupRoomsSnapshot();
    setupContactsSnapshot();

    if (currentUser) {
      byId("auth-screen").style.display = "none";
      const appRoot = byId("main-app");
      appRoot.style.display = "flex";
      enterRoom("général");
    }
  }

  initApp();
</script>
</body>
</html>
