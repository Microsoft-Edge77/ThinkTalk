<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>ThinkTalk</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PARTICLES -->
<canvas id="canvas-dust"></canvas>

<!-- POPUPS -->
<div class="popup-overlay" id="pop-logout">
  <div class="popup-card" id="card-logout">
    <h3>SESSION</h3>
    <p class="popup-message-text">Que faire ?</p>
    <button class="btn-full" id="btn-logout">SE DÉCONNECTER</button>
    <button class="btn-full danger" id="btn-delete-profile">SUPPRIMER LE PROFIL</button>
    <button class="btn-full neutral" data-close-popup>ANNULER</button>
  </div>
</div>

<div class="popup-overlay" id="pop-create">
  <div class="popup-card" id="card-create">
    <h3>NOUVEAU SALON</h3>
    <input type="text" id="new-room-name" placeholder="Nom du salon..." class="input-box mt12">
    <input type="password" id="new-room-pass" placeholder="Code (optionnel)..." class="input-box">
    <button class="btn-full" id="btn-do-create">CRÉER</button>
    <button class="btn-full neutral" data-close-popup>ANNULER</button>
  </div>
</div>

<div class="popup-overlay" id="pop-options">
  <div class="popup-card" id="card-options">
    <h3>OPTIONS</h3>
    <button class="btn-full danger" id="btn-msg-del">SUPPRIMER</button>
    <button class="btn-full neutral" data-close-popup>ANNULER</button>
  </div>
</div>

<div class="popup-overlay" id="pop-accent">
  <div class="popup-card" id="card-accent">
    <h3>COULEUR D'ACCENT</h3>
    <div class="color-grid" id="accent-presets"></div>
    <button class="btn-full neutral" id="btn-more-colors">PLUS DE COULEURS</button>
    <button class="btn-full neutral" id="btn-neon-colors">COULEURS NÉON</button>

    <div id="advanced-color" class="hidden mt12">
      <input type="color" id="accent-picker" class="color-picker-input">
    </div>

    <button class="btn-full neutral" data-close-popup>FERMER</button>
  </div>
</div>

<div class="popup-overlay" id="pop-message">
  <div class="popup-card" id="card-message">
    <h3 id="msg-title">INFO</h3>
    <div class="popup-message-text" id="msg-text"></div>
    <button class="btn-full" id="msg-ok-btn">OK</button>
  </div>
</div>

<div class="popup-overlay" id="pop-confirm">
  <div class="popup-card" id="card-confirm">
    <h3 id="confirm-title">CONFIRMATION</h3>
    <div class="popup-message-text" id="confirm-text"></div>
    <button class="btn-full" id="confirm-yes">OUI</button>
    <button class="btn-full neutral" id="confirm-no">ANNULER</button>
  </div>
</div>

<!-- AUTH -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-title">ThinkTalk</div>
  <div id="auth-mode-title" class="auth-subtitle">Se connecter</div>

  <div id="auth-card" class="auth-card auth-active">
    <input type="text" id="auth-pseudo" class="input-box" placeholder="Pseudo">
    <input type="password" id="auth-code" class="input-box" placeholder="Code secret">
    <button class="btn-full" id="btn-login">SE CONNECTER</button>
    <div class="auth-toggle-link" id="auth-toggle">Vous n'avez pas de compte ? Rejoindre ThinkTalk</div>
  </div>
</div>

<!-- APP -->
<div class="app-root" id="main-app">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-title" id="btn-open-session">ThinkTalk</div>
    <div class="top-actions">
      <button class="top-btn" id="btn-open-accent">Accent</button>
      <button class="top-btn" id="btn-wallpaper">Wallpaper</button>
    </div>
  </div>

  <!-- VIEWS -->
  <div class="view-container">

    <!-- HOME -->
    <section id="view-home" class="view-section active">
      <div class="row">
        <input type="text" id="rooms-search" class="input-box" placeholder="Chercher un salon...">
        <button class="btn-icon" id="btn-open-create">+</button>
      </div>
      <div class="tiles-grid" id="rooms-grid"></div>
    </section>

    <!-- CHAT -->
    <section id="view-chat" class="view-section">

      <!-- Wallpaper is applied HERE -->
      <div id="chat-header" class="chat-header"># général</div>

      <div id="chat-messages" class="chat-messages"></div>

      <div class="chat-input-bar">
        <button id="btn-attach" class="btn-attach">📎</button>
        <input type="file" id="file-input" hidden accept="image/*">
        <input type="file" id="bg-file-input" hidden accept="image/*">
        <input type="text" id="chat-input" class="input-box" placeholder="Message...">
        <button id="send-btn" class="btn-icon">OK</button>
      </div>
    </section>

    <!-- CONTACTS -->
    <section id="view-contacts" class="view-section">
      <div class="row">
        <input type="text" id="contact-name-input" class="input-box" placeholder="Pseudo de l'ami...">
        <button class="btn-icon" id="btn-add-contact">+</button>
      </div>

      <div id="contact-suggestions" class="suggestions"></div>

      <input type="text" id="contacts-search" class="input-box" placeholder="Chercher un contact...">
      <div class="tiles-grid" id="contacts-grid"></div>
    </section>

  </div>

  <!-- NAV -->
  <nav class="bottom-nav">
    <div class="nav-btn active" data-tab="home">HOME</div>
    <div class="nav-btn" data-tab="chat">CHAT</div>
    <div class="nav-btn" data-tab="contacts">CONTACTS</div>
  </nav>
</div>

<!-- Script -->
<script type="module" src="app.js"></script>

</body>
</html>
