<style>

nav button.on{opacity:1;background:rgba(255,255,255,.10)}

svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:12px;padding:20px 28px 10px}
header h1{font-weight:600;font-size:30px;letter-spacing:-.4px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,input,select,textarea{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tile:focus-visible{outline:2px solid color-mix(in srgb,var(--a) 85%,#fff);outline-offset:2px}
.btn{background:color-mix(in srgb,var(--a) 88%,#fff);border:0;padding:11px 20px;cursor:pointer;font-weight:600;font-size:15px;color:#fff;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;box-shadow:0 8px 22px color-mix(in srgb,var(--a) 28%,transparent)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:scale(.97);filter:brightness(.9)}
.ib{background:transparent;border:0;cursor:pointer;padding:9px;display:inline-flex;opacity:.72;transition:opacity .18s ease,background .18s ease,transform .18s ease}
.ib:hover{opacity:1;background:rgba(255,255,255,.09);transform:translateY(-1px)}
.nex{opacity:.55;color:var(--text);text-decoration:none}
.nex:hover{opacity:1;background:rgba(255,255,255,.09);transform:translateY(-1px)}
input[type=text],input[type=password],textarea,select{background:rgba(255,255,255,.07);border:0;padding:12px 14px;width:100%;font-size:15px;transition:background .2s ease,box-shadow .2s ease}
select option{background:#111318}
input:focus,textarea:focus,select:focus{background:rgba(255,255,255,.11);box-shadow:inset 0 -2px 0 var(--a)}
input[type=range]{width:130px;accent-color:var(--a)}
input[type=checkbox]{accent-color:var(--a);width:18px;height:18px}
#view{flex:1;overflow:auto;padding:8px 28px 28px;min-height:0;container-type:inline-size;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
#find{font-size:17px;padding:14px 16px;margin-top:10px;background:rgba(255,255,255,.06)}

.ts{animation:ts .45s cubic-bezier(.16,1,.3,1) both;transform-origin:0 50%}

.compose,.chip{padding-left:14px;padding-right:14px}
.m{max-width:96%}
.forms{grid-template-columns:1fr}
}

if(tr){const nick=$('#auth-nick-login').value.trim();if(!nick)throw new Error(trn('nickname_required'));let priv;if(local&&sameNick(local.nick,nick)){acc=local;priv=await unlockChecked(acc,code);try{const remote=await cloudGetNick(nick);if(remote.id!==local.id||remote.pub!==local.pub)throw new Error(trn('invalid_account'));acc=remote;}catch(err){if(String(err.message).includes('Compte introuvable')){await cloudRegister(local)}else if(err.message===trn('invalid_account'))throw err;/* A matching local account remains usable offline if the cloud service is unavailable. */}}else{acc=await cloudGetNick(nick);if(!sameNick(acc.nick,nick))throw new Error(trn('invalid_account'));priv=await unlockChecked(acc,code)}if(!priv)priv=await unlockChecked(acc,code);await DB.set('acct',acc);S.me={id:acc.id,nick:acc.nick,pub:acc.pub,priv};
}else{const nick=$('#auth-nick').value.trim();if(!nick)throw new Error(trn('nickname_required'));acc=await createAcct(nick,code);await cloudRegister(acc);await DB.set('acct',acc);S.me={id:acc.id,nick:acc.nick,pub:acc.pub,priv:await unlockChecked(acc,code)};}
L.style.display='none';await boot();
}catch(e){status.textContent=e?.name==='OperationError'?trn('wrong_password'):(e.message||trn('generic_error'));btn.disabled=false}}
}
async function boot(){S.blocked=new Set(await DB.get('blocked')||[]);S.contacts=await DB.get('contacts')||{};S.reports=await DB.get('reports')||[];
const saved=await DB.get('rooms')||[];if(!saved.find(r=>r.id==='general'))saved.unshift({id:'general',name:'Général',desc:'Salon public ouvert à tous',pub:true});const gz=saved.find(r=>r.id==='general');gz.name='Général';gz.desc='Salon public ouvert à tous';
for(const r of saved)S.rooms[r.id]={...r,peers:new Set(),evs:new Map()};for(const r of Object.values(S.rooms))for(const e of await DB.room(r.id))r.evs.set(e.id,e);
render(true);await netInit();render(false)}

const authCss=document.createElement('style');authCss.textContent=`#login{padding:20px;background:radial-gradient(ellipse at 50% 35%,rgba(0,120,215,.19),transparent 55%),rgba(0,0,0,.82)}#login>div.auth-card{width:min(460px,100%);padding:34px;gap:13px;background:rgba(17,22,30,.94);border-top:3px solid var(--a);box-shadow:0 28px 90px rgba(0,0,0,.6)}.auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}.auth-mark{width:48px;height:48px;background:var(--a);display:grid;place-items:center;font-size:28px;font-weight:700}.auth-brand h1{font-size:29px;font-weight:650;line-height:1.1}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(255,255,255,.14);margin:8px 0 4px}.auth-tab{background:transparent;border:0;padding:12px 6px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-weight:600}.auth-tab.active{color:#fff;border-bottom-color:var(--a)}.auth-intro{padding:8px 0}.auth-intro h2{font-size:25px;font-weight:600}.auth-label{font-size:13px;color:var(--muted);font-weight:600;margin-top:3px}.auth-card input{background:rgba(255,255,255,.075);border-bottom:2px solid rgba(255,255,255,.16);padding:14px}.auth-card input:focus{border-bottom-color:var(--a)}.auth-submit{width:100%;margin-top:8px;padding:14px}.auth-submit:disabled{opacity:.55;cursor:wait}.auth-link{background:transparent;border:0;color:var(--muted);padding:7px;cursor:pointer;font-size:13px}.auth-link:hover{color:white}.local-account{display:grid;gap:3px;padding:12px;background:rgba(255,255,255,.055);border-left:3px solid var(--a)}.local-account small{color:var(--muted);overflow-wrap:anywhere}.auth-status{min-height:20px;color:#ff9b9b;font-size:13px}.auth-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;color:var(--muted);font-size:11px}.auth-lang{display:flex;gap:4px}.auth-lang button{background:transparent;border:0;color:var(--muted);padding:5px 7px;cursor:pointer}.auth-lang button.selected{background:var(--a);color:white}@media(max-width:480px){#login>div.auth-card{padding:25px 21px}.auth-brand h1{font-size:26px}}`;
document.head.append(authCss);
applyCfg();sizeBg();addEventListener('resize',sizeBg);requestAnimationFrame(frame);login();
