<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ThinkTalk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --accent: #0078d7; --bg: #000; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100svh; position: fixed; width: 100%; }
        #canvas-dust { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .app-root { position: relative; z-index: 1; height: 100%; display: none; flex-direction: column; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s; }
        .view-blur { filter: blur(25px); transform: translateX(-30px); }

        .tiles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; transition: 0.5s; }
        .tile { position: relative; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer; backdrop-filter: blur(10px); transition: transform 0.4s, opacity 0.4s; overflow: hidden; }
        .tile.visible { opacity: 1; }
        .lock-badge { position: absolute; top: 10px; right: 10px; font-size: 0.7rem; opacity: 0.5; }

        .tile-preview { font-size: 0.7rem; color: #aaa; margin-top: 6px; max-height: 2.4em; overflow: hidden; line-height: 1.2em; }

        .msg-block { opacity: 0; transform: translateY(10px); transition: opacity 0.5s 0.8s, transform 0.5s 0.8s; margin-bottom: 20px; max-width: 85%; cursor: pointer; }
        .msg-block.own { align-self: flex-end; }
        .msg-block.visible { opacity: 1; transform: translateY(0); }
        .msg-info { font-size: 0.65rem; color: #888; margin-bottom: 4px; display: flex; gap: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .msg-block.own .msg-info { justify-content: flex-end; color: var(--accent); }
        .msg-text { background: rgba(0,120,215,0.1); padding: 12px; border-left: 3px solid var(--accent); word-break: break-word; }
        .msg-block.own .msg-text { border-left: none; border-right: 3px solid #666; background: rgba(255,255,255,0.05); }
        .msg-img { max-width: 100%; border-radius: 4px; margin-top: 8px; display: block; }

        .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .popup-card { background: #000; border: 2px solid var(--accent); width: 100%; max-width: 320px; padding: 25px; opacity: 0; transition: opacity 0.4s; }
        .popup-card.visible { opacity: 1; }

        .top-bar { padding: 15px; display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .top-title { font-size: 2.2rem; font-weight: 100; color: var(--accent); cursor: pointer; }
        .top-actions { display:flex; gap:10px; align-items:center; }
        .top-btn { background:#111; border:1px solid #333; color:var(--accent); padding:6px 10px; cursor:pointer; font-size:0.8rem; }

        .view-container { flex: 1; overflow-y: auto; padding: 10px 10px 120px 10px; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; display: flex; background: #000; border-top: 1px solid #222; }
        .nav-btn { flex: 1; display: flex; align-items: center; justify-content: center; color: #666; cursor: pointer; font-size: 0.8rem; letter-spacing: 1px; }
        .nav-btn.active { color: #fff; border-top: 3px solid var(--accent); font-weight: bold; }
        .input-box { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid #333; padding: 12px; color: #fff; outline: none; margin-bottom: 10px; }
        .btn-full { width: 100%; padding: 15px; background: var(--accent); border: none; color: #fff; cursor: pointer; font-weight: bold; text-transform: uppercase; }

        .color-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .color-dot { width:24px; height:24px; border-radius:50%; border:2px solid #444; cursor:pointer; }
    </style>
</head>
<body>

<canvas id="canvas-dust"></canvas>

<!-- POPUP SESSION / PROFIL -->
<div class="popup-overlay" id="pop-logout">
    <div class="popup-card" id="card-logout">
        <h3>SESSION</h3>
        <p style="margin:15px 0">Que voulez-vous faire ?</p>
        <button class="btn-full" onclick="confirmLogout()">SE DÉCONNECTER</button>
        <button class="btn-full" style="background:#800;margin-top:10px" onclick="confirmDeleteProfile()">SUPPRIMER LE PROFIL</button>
        <button class="btn-full" style="background:#222;margin-top:10px" onclick="closePopups()">ANNULER</button>
    </div>
</div>

<!-- POPUP CRÉATION SALON -->
<div class="popup-overlay" id="pop-create">
    <div class="popup-card" id="card-create">
        <h3>NOUVEAU SALON</h3>
        <input type="text" id="new-room-name" placeholder="Nom du salon..." class="input-box" style="margin-top:15px">
        <input type="password" id="new-room-pass" placeholder="Code (optionnel)..." class="input-box">
        <button class="btn-full" id="btn-do-create">CRÉER</button>
        <button class="btn-full" style="background:#222;margin-top:10px" onclick="closePopups()">ANNULER</button>
    </div>
</div>

<!-- POPUP OPTIONS MESSAGE -->
<div class="popup-overlay" id="pop-options">
    <div class="popup-card" id="card-options">
        <h3>OPTIONS</h3>
        <button class="btn-full" style="background:#800;margin-top:20px" id="btn-msg-del">SUPPRIMER</button>
        <button class="btn-full" style="background:#222;margin-top:10px" onclick="closePopups()">ANNULER</button>
    </div>
</div>

<!-- POPUP THEME / COULEURS -->
<div class="popup-overlay" id="pop-theme">
    <div class="popup-card" id="card-theme">
        <h3>COULEUR D'ACCENT</h3>
        <p style="margin:10px 0;font-size:0.8rem;color:#aaa">Choisissez une couleur principale :</p>
        <div class="color-row" id="theme-basic">
            <div class="color-dot" data-color="#0078d7" style="background:#0078d7"></div>
            <div class="color-dot" data-color="#ff4081" style="background:#ff4081"></div>
            <div class="color-dot" data-color="#00c853" style="background:#00c853"></div>
            <div class="color-dot" data-color="#ffab00" style="background:#ffab00"></div>
            <div class="color-dot" data-color="#9c27b0" style="background:#9c27b0"></div>
        </div>
        <button class="btn-full" style="background:#222;margin-top:15px" id="btn-more-colors">PLUS DE COULEURS</button>
        <div id="theme-more" style="display:none;margin-top:10px">
            <div class="color-row">
                <div class="color-dot" data-color="#03a9f4" style="background:#03a9f4"></div>
                <div class="color-dot" data-color="#e91e63" style="background:#e91e63"></div>
                <div class="color-dot" data-color="#4caf50" style="background:#4caf50"></div>
                <div class="color-dot" data-color="#ff5722" style="background:#ff5722"></div>
                <div class="color-dot" data-color="#cddc39" style="background:#cddc39"></div>
                <div class="color-dot" data-color="#673ab7" style="background:#673ab7"></div>
                <div class="color-dot" data-color="#00bcd4" style="background:#00bcd4"></div>
                <div class="color-dot" data-color="#ffc107" style="background:#ffc107"></div>
            </div>
        </div>
        <button class="btn-full" style="background:#222;margin-top:15px" onclick="closePopups()">FERMER</button>
    </div>
</div>

<!-- ÉCRAN AUTH -->
<div id="auth-screen" style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; z-index:10;">
    <div style="font-size:3rem; color:var(--accent); text-align:center; margin-bottom:30px; font-weight:100;">thinktalk</div>
    <div style="width:300px; margin:0 auto;">
        <input type="text" id="auth-pseudo" class="input-box" placeholder="Pseudo">
        <input type="password" id="auth-code" class="input-box" placeholder="Code secret">
        <button class="btn-full" id="btn-login">ENTRER</button>
    </div>
</div>

<!-- APP PRINCIPALE -->
<div class="app-root" id="main-app">
    <div class="top-bar">
        <div class="top-title" onclick="openPopup('pop-logout', 'card-logout')">thinktalk</div>
        <div class="top-actions">
            <button class="top-btn" id="btn-accent">🎨 Couleur</button>
        </div>
    </div>
    <div class="view-container">
        <!-- HOME / ROOMS -->
        <section id="view-home" class="view-section active">
            <div style="display:flex;gap:10px;margin-bottom:10px">
                <input type="text" id="rooms-search" class="input-box" style="margin:0" placeholder="Chercher un salon...">
                <button style="background:var(--accent);border:none;color:#fff;padding:0 20px" onclick="openPopup('pop-create', 'card-create')">+</button>
            </div>
            <div class="tiles-grid" id="rooms-grid"></div>
        </section>

        <!-- CHAT -->
        <section id="view-chat" class="view-section">
            <div id="chat-header" style="color:var(--accent);margin-bottom:15px;font-weight:bold"># général</div>
            <div id="chat-messages"></div>
            <div style="position:fixed;bottom:60px;left:0;right:0;display:flex;background:#000;padding:10px;gap:8px;border-top:1px solid #222">
                <button onclick="document.getElementById('file-input').click()" style="background:#222;color:#fff;border:none;padding:0 15px;cursor:pointer">📎</button>
                <input type="file" id="file-input" hidden accept="image/*">
                <input type="text" id="chat-input" class="input-box" style="margin:0" placeholder="Message...">
                <button id="send-btn" style="background:var(--accent);color:#fff;border:none;padding:0 20px">OK</button>
            </div>
        </section>

        <!-- CONTACTS -->
        <section id="view-contacts" class="view-section">
            <div style="display:flex;gap:10px;margin-bottom:10px">
                <input type="text" id="contacts-search" class="input-box" style="margin:0" placeholder="Chercher un contact...">
            </div>
            <div style="display:flex;gap:10px;margin-bottom:20px">
                <input type="text" id="contact-name-input" class="input-box" style="margin:0" placeholder="Pseudo de l'ami à ajouter...">
                <button style="background:var(--accent);border:none;color:#fff;padding:0 20px" id="btn-add-contact">+</button>
            </div>
            <div class="tiles-grid" id="contacts-grid"></div>
        </section>
    </div>

    <nav class="bottom-nav">
        <div class="nav-btn active" onclick="switchTab('home')">HOME</div>
        <div class="nav-btn" onclick="switchTab('chat')">CHAT</div>
        <div class="nav-btn" onclick="switchTab('contacts')">CONTACTS</div>
    </nav>
</div>

<script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://znbypfscxvmxvwnwevsy.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuYnlwZnNjeHZteHZ3bndldnN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjAzMzMsImV4cCI6MjA5NDY5NjMzM30.7q04-YpG2TFWNjZyIoad4gFiKaqL9-jUl72s3OB9RlE";
    const supabase = createClient(supabaseUrl, supabaseKey);

    let currentUser = localStorage.getItem('tt_user');
    let curRoom = "général", chatChannel = null, selectedMsgId = null;

    let roomsCache = [];      // { room, previews: [string,...] }
    let contactsCache = [];   // { name, previews: [string,...] }

    // --- MOTEUR PARTICULES ---
    const canvas = document.getElementById('canvas-dust'), ctx = canvas.getContext('2d');
    let pts = [], mouse = {x: -1000, y: -1000};
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.onresize = resize; resize();
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    class Particle {
        constructor() { this.init(); this.target = null; }
        init() { 
            this.x = Math.random()*canvas.width; 
            this.y = Math.random()*canvas.height; 
            this.vx = (Math.random()-0.5)*1.5; 
            this.vy = (Math.random()-0.5)*1.5; 
            this.s = Math.random()*2+1; 
        }
        update() {
            if(this.target) { 
                this.x += (this.target.x - this.x) * 0.15; 
                this.y += (this.target.y - this.y) * 0.15; 
            } else {
                let dx = mouse.x - this.x, dy = mouse.y - this.y, d = Math.sqrt(dx*dx+dy*dy);
                if(d < 180) { this.vx += dx*0.002; this.vy += dy*0.002; }
                this.x += this.vx; this.y += this.vy; this.vx *= 0.99; this.vy *= 0.99;
                if(this.x<0||this.x>canvas.width) this.vx *= -1; 
                if(this.y<0||this.y>canvas.height) this.vy *= -1;
            }
        }
        draw() { 
            ctx.fillStyle = "#0078d7cc"; 
            ctx.shadowBlur = 8; 
            ctx.shadowColor = "#0078d7"; 
            ctx.beginPath(); 
            ctx.arc(this.x,this.y,this.s,0,Math.PI*2); 
            ctx.fill(); 
            ctx.shadowBlur = 0; 
        }
    }
    for(let i=0; i<400; i++) pts.push(new Particle());
    function anim() { 
        ctx.clearRect(0,0,canvas.width,canvas.height); 
        pts.forEach(p=>{p.update();p.draw()}); 
        requestAnimationFrame(anim); 
    } 
    anim();

    window.materialize = (el, delay = 0) => {
        setTimeout(() => {
            const r = el.getBoundingClientRect();
            const pCount = 30; let targets = [];
            for(let i=0; i<pCount; i++) { 
                targets.push({x: r.left + (r.width/pCount)*i, y: r.top}); 
                targets.push({x: r.left + (r.width/pCount)*i, y: r.bottom}); 
            }
            pts.forEach((p, index) => { if(targets[index]) p.target = targets[index]; });
            setTimeout(() => { 
                pts.forEach(p => p.target = null); 
                el.classList.add('visible'); 
            }, 800);
        }, delay);
    };

    window.openPopup = (popId, cardId) => {
        document.getElementById(popId).style.display = 'flex';
        materialize(document.getElementById(cardId));
    };
    window.closePopups = () => { 
        document.querySelectorAll('.popup-overlay').forEach(p=>p.style.display='none'); 
        document.querySelectorAll('.popup-card').forEach(c=>c.classList.remove('visible')); 
    };

    // --- THEME / COULEUR ---
    function setAccent(color) {
        document.documentElement.style.setProperty('--accent', color);
        localStorage.setItem('tt_accent', color);
    }
    function initTheme() {
        const saved = localStorage.getItem('tt_accent');
        if(saved) setAccent(saved);
        document.querySelectorAll('.color-dot[data-color]').forEach(btn => {
            btn.addEventListener('click', () => {
                const c = btn.getAttribute('data-color');
                setAccent(c);
            });
        });
        const moreBtn = document.getElementById('btn-more-colors');
        const morePanel = document.getElementById('theme-more');
        moreBtn.addEventListener('click', () => {
            morePanel.style.display = morePanel.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('btn-accent').onclick = () => openPopup('pop-theme','card-theme');
    }

    // --- DÉCONNEXION SIMPLE ---
    window.confirmLogout = () => { 
        localStorage.removeItem('tt_user'); 
        location.reload(); 
    };

    // --- SUPPRESSION DE PROFIL ---
    window.confirmDeleteProfile = async () => {
        if(!currentUser) return;
        const ok = confirm("Supprimer définitivement le profil et les contacts liés ?");
        if(!ok) return;

        try {
            await supabase.from("users").delete().eq("name", currentUser);
            await supabase.from("contacts").delete().or(`owner.eq.${currentUser},name.eq.${currentUser}`);
            localStorage.removeItem('tt_user');
            alert("Profil supprimé.");
            location.reload();
        } catch (e) {
            console.error(e);
            alert("Erreur lors de la suppression du profil.");
        }
    };

    window.switchTab = (tab) => {
        const appRoot = document.getElementById('main-app'); 
        appRoot.classList.add('view-blur');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`[onclick="switchTab('${tab}')"]`);
        if(btn) btn.classList.add('active');
        setTimeout(() => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + tab).classList.add('active');
            appRoot.classList.remove('view-blur');
            if(tab === 'chat') { 
                document.querySelectorAll('.msg-block').forEach((m, i) => { 
                    m.classList.remove('visible'); 
                    materialize(m, i * 100); 
                }); 
            }
        }, 400);
    };

    // --- AUTHENTIFICATION ---
    document.getElementById('btn-login').onclick = async () => {
        const p = document.getElementById('auth-pseudo').value.trim().toLowerCase();
        const c = document.getElementById('auth-code').value.trim();
        if(!p || !c) return alert("Pseudo et code requis !");

        const { data: user, error } = await supabase
            .from("users")
            .select("*")
            .eq("name", p)
            .maybeSingle();

        if(user) {
            if(user.code === c) { 
                localStorage.setItem('tt_user', p); 
                location.reload(); 
            } else { 
                alert("Code secret incorrect !"); 
            }
        } else {
            await supabase.from("users").insert({ name: p, code: c });
            localStorage.setItem('tt_user', p); 
            location.reload();
        }
    };

    // --- MESSAGES ---
    async function renderMessages() {
        const { data, error } = await supabase
            .from("messages")
            .select("*")
            .eq("room", curRoom)
            .order("timestamp", { ascending: true });

        if(error) {
            console.error(error);
            return;
        }

        const box = document.getElementById('chat-messages'); 
        box.innerHTML="";
        (data || []).forEach(m => {
            const date = m.timestamp ? new Date(m.timestamp) : new Date();
            const timeStr = date.getHours().toString().padStart(2,'0') + ":" + date.getMinutes().toString().padStart(2,'0');
            const div = document.createElement('div');
            div.className = "msg-block" + (m.sender === currentUser ? " own" : "");
            let content = m.image ? `<img src="${m.image}" class="msg-img">` : (m.text || "");
            div.innerHTML = `<div class="msg-info"><span>${m.sender}</span><span>${timeStr}</span></div><div class="msg-text">${content}</div>`;
            div.onclick = () => { 
                if(m.sender === currentUser) { 
                    selectedMsgId = m.id; 
                    openPopup('pop-options', 'card-options'); 
                } 
            };
            box.appendChild(div);
            div.classList.add('visible');
        });
        box.parentElement.scrollTop = box.parentElement.scrollHeight;
    }

    // --- LOGIQUE SALONS & CHAT ---
    function hasRoomAccessLocally(roomName) {
        if(!currentUser) return false;
        return localStorage.getItem(`tt_access_${currentUser}_${roomName}`) === "1";
    }
    function storeRoomAccessLocally(roomName) {
        if(!currentUser) return;
        localStorage.setItem(`tt_access_${currentUser}_${roomName}`, "1");
    }

    window.enterRoom = async (name, isPrivateChat=false) => {
        if(!isPrivateChat) {
            const { data: rooms, error } = await supabase
                .from("rooms")
                .select("*")
                .eq("name", name)
                .limit(1);

            if(!error && rooms && rooms.length > 0) {
                const roomData = rooms[0];
                if(roomData.pass && roomData.pass !== "") {
                    if(!hasRoomAccessLocally(name)) {
                        const code = prompt("Salon privé. Entrez le code :");
                        if(code !== roomData.pass) return alert("Code erroné.");
                        storeRoomAccessLocally(name);
                    }
                }
            }
        }
        
        curRoom = isPrivateChat ? [currentUser, name].sort().join("_") : name;
        document.getElementById('chat-header').innerText = isPrivateChat ? "@ " + name : "# " + name;
        switchTab('chat');

        if(chatChannel) {
            await supabase.removeChannel(chatChannel);
            chatChannel = null;
        }

        await renderMessages();

        chatChannel = supabase
            .channel("room:" + curRoom)
            .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "messages", filter: `room=eq.${curRoom}` },
                payload => {
                    renderMessages();
                }
            )
            .subscribe();
    };

    // CRÉATION SALON
    document.getElementById('btn-do-create').onclick = async () => {
        const name = document.getElementById('new-room-name').value.trim();
        const pass = document.getElementById('new-room-pass').value.trim();
        if(name) { 
            await supabase.from("rooms").insert({ name: name, pass: pass || "" }); 
            closePopups(); 
            document.getElementById('new-room-name').value=""; 
            document.getElementById('new-room-pass').value="";
        }
    };

    // ENVOI MESSAGE TEXTE
    document.getElementById('send-btn').onclick = async () => {
        const i = document.getElementById('chat-input');
        if(i.value.trim()){ 
            await supabase.from("messages").insert({
                text: i.value, 
                room: curRoom, 
                sender: currentUser, 
                timestamp: new Date().toISOString()
            }); 
            i.value=""; 
        }
    };

    // ENVOI IMAGE
    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0]; 
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => { 
            await supabase.from("messages").insert({ 
                image: ev.target.result, 
                room: curRoom, 
                sender: currentUser, 
                timestamp: new Date().toISOString()
            }); 
        };
        reader.readAsDataURL(file);
    };

    // SUPPRESSION MESSAGE
    document.getElementById('btn-msg-del').onclick = async () => { 
        if(selectedMsgId) { 
            try {
                await supabase.from("messages").delete().eq("id", selectedMsgId); 
            } catch(e) {
                console.error(e);
                alert("Impossible de supprimer le message (vérifie les règles).");
            }
            closePopups(); 
            selectedMsgId = null;
        }
    };

    // --- CONTACTS ---
    document.getElementById('btn-add-contact').onclick = async () => {
        const name = document.getElementById('contact-name-input').value.trim().toLowerCase();
        if(!name || name === currentUser) return;
        const { data: user, error } = await supabase
            .from("users")
            .select("name")
            .eq("name", name)
            .maybeSingle();
        if(!user) {
            alert("Cet utilisateur n'existe pas.");
            return;
        }
        await supabase.from("contacts").insert({ owner: currentUser, name: name });
        document.getElementById('contact-name-input').value = "";
    };

    // --- RENDER ROOMS + PREVIEWS ---
    async function buildRoomPreviews(rooms) {
        const result = [];
        for(const r of rooms) {
            const { data: msgs, error } = await supabase
                .from("messages")
                .select("sender,text,image,timestamp")
                .eq("room", r.name)
                .order("timestamp", { ascending:false })
                .limit(2);
            let previews = [];
            if(msgs && msgs.length > 0) {
                previews = msgs.map(m => {
                    const base = m.image ? "[image]" : (m.text || "");
                    return `${m.sender}: ${base}`.slice(0,60);
                }).reverse();
            }
            result.push({ room: r, previews });
        }
        return result;
    }

    async function renderRooms() {
        const { data, error } = await supabase.from("rooms").select("*");
        if(error) { console.error(error); return; }
        const rooms = data || [];
        const withPreviews = await buildRoomPreviews(rooms);
        roomsCache = withPreviews;
        applyRoomFilter();
    }

    function applyRoomFilter() {
        const term = (document.getElementById('rooms-search').value || "").trim().toLowerCase();
        const g = document.getElementById('rooms-grid'); 
        g.innerHTML="";
        roomsCache
            .filter(item => !term || item.room.name.toLowerCase().includes(term))
            .forEach(item => {
                const r = item.room;
                const t = document.createElement('div'); 
                t.className="tile";
                let previewHtml = "";
                if(item.previews.length > 0) {
                    previewHtml = `<div class="tile-preview">${item.previews.join("<br>")}</div>`;
                }
                t.innerHTML = `<span># ${r.name}</span> ${r.pass ? '<span class="lock-badge">🔒</span>' : ''}${previewHtml}`;
                t.onclick = () => enterRoom(r.name); 
                g.appendChild(t);
            });
    }

    // --- RENDER CONTACTS + PREVIEWS ---
    async function buildContactPreviews(names) {
        const result = [];
        for(const name of names) {
            const roomName = [currentUser, name].sort().join("_");
            const { data: msgs, error } = await supabase
                .from("messages")
                .select("sender,text,image,timestamp")
                .eq("room", roomName)
                .order("timestamp", { ascending:false })
                .limit(2);
            let previews = [];
            if(msgs && msgs.length > 0) {
                previews = msgs.map(m => {
                    const base = m.image ? "[image]" : (m.text || "");
                    return `${m.sender}: ${base}`.slice(0,60);
                }).reverse();
            }
            result.push({ name, previews });
        }
        return result;
    }

    async function renderContacts() {
        const { data, error } = await supabase.from("contacts").select("*");
        if(error) { console.error(error); return; }
        let list = new Set();
        (data || []).forEach(c => { 
            if(c.owner === currentUser) list.add(c.name); 
            if(c.name === currentUser) list.add(c.owner); 
        });
        const names = Array.from(list);
        const withPreviews = await buildContactPreviews(names);
        contactsCache = withPreviews;
        applyContactsFilter();
    }

    function applyContactsFilter() {
        const term = (document.getElementById('contacts-search').value || "").trim().toLowerCase();
        const g = document.getElementById('contacts-grid'); 
        g.innerHTML=""; 
        contactsCache
            .filter(item => !term || item.name.toLowerCase().includes(term))
            .forEach(item => {
                const t = document.createElement('div'); 
                t.className="tile"; 
                let previewHtml = "";
                if(item.previews.length > 0) {
                    previewHtml = `<div class="tile-preview">${item.previews.join("<br>")}</div>`;
                }
                t.innerHTML=`<span>@ ${item.name}</span>${previewHtml}`;
                t.onclick = () => enterRoom(item.name, true); 
                g.appendChild(t);
            });
    }

    // --- REALTIME ROOMS & CONTACTS ---
    const roomsChannel = supabase
        .channel("rooms")
        .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "rooms" },
            payload => { renderRooms(); }
        )
        .subscribe();

    const contactsChannel = supabase
        .channel("contacts")
        .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "contacts" },
            payload => { renderContacts(); }
        )
        .subscribe();

    // --- ENSURE BASE DATA (via Edge Function + général) ---
    async function initDatabase() {
        // Appel de l’Edge Function init-db
        await supabase.functions.invoke("init-db");
    }

    // --- INIT APP ---
    document.getElementById('rooms-search').addEventListener('input', applyRoomFilter);
    document.getElementById('contacts-search').addEventListener('input', applyContactsFilter);

    initTheme();

    (async () => {
        await initDatabase();          // crée les tables + policies + "général"
        if(currentUser){ 
            document.getElementById('auth-screen').style.display='none'; 
            document.getElementById('main-app').style.display='flex'; 
            await renderRooms();
            await renderContacts();
            enterRoom("général"); 
        }
    })();
</script>
</body>
</html>
